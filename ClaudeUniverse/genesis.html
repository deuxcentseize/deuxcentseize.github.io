    const master = ctx.createGain(); master.gain.value=0.0; master.connect(ctx.destination);
    AUDIO.master = master;
    // simple stereo space via feedback delay
    const delay=ctx.createDelay(1.0); delay.delayTime.value=0.36;
    const fb=ctx.createGain(); fb.gain.value=0.34; delay.connect(fb); fb.connect(delay);
    const wet=ctx.createGain(); wet.gain.value=0.22; delay.connect(wet); wet.connect(master);
    const filter=ctx.createBiquadFilter(); filter.type='lowpass'; filter.frequency.value=400; filter.Q.value=0.6;
    filter.connect(master); filter.connect(delay);
    AUDIO.filter=filter;
    // drone voices
    for(let i=0;i<5;i++){
      const osc=ctx.createOscillator(); osc.type=(i%2?'triangle':'sawtooth');
      osc.detune.value=(i-2)*4;
      const g=ctx.createGain(); g.gain.value=0.0;
      osc.connect(g); g.connect(filter); osc.start();
      AUDIO.voices.push({osc,g});
    }
    // sub
    const sub=ctx.createOscillator(); sub.type='sine';
    const subg=ctx.createGain(); subg.gain.value=0.0; sub.connect(subg); subg.connect(master); sub.start();
    AUDIO.sub={osc:sub,g:subg};
    AUDIO.ready=true;
  }catch(e){ /* silent */ }
}
function audioResume(){ if(AUDIO.ready && AUDIO.ctx && AUDIO.ctx.state!=='running'){ AUDIO.ctx.resume().catch(()=>{}); } }
function audioAccent(freq, when){
  if(!AUDIO.ready || AUDIO.ctx.state!=='running') return;
  const ctx=AUDIO.ctx, t=ctx.currentTime;
  const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=freq;
  const g=ctx.createGain(); g.gain.setValueAtTime(0.0,t); g.gain.linearRampToValueAtTime(0.12,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+3.5);
  o.connect(g); g.connect(AUDIO.filter); o.start(t); o.stop(t+3.6);
}
function updateAudio(pt){
  if(!AUDIO.ready) return;
  const ctx=AUDIO.ctx;
  if(ctx.state==='running' && !AUDIO.on){ AUDIO.on=true; AUDIO.master.gain.setTargetAtTime(0.14, ctx.currentTime, 1.5); }
  if(!AUDIO.on) return;
  // blend mood by movement weights
  let root=0,bright=0,level=0,tot=0; const chord=[0,0,0,0,0];
  for(const m of MOVEMENTS){ const {w}=movWeight(m,pt); if(w<=0) continue; const s=AUDIO_MOODS[m.name]; tot+=w;
    root+=s.root*w; bright+=s.bright*w; level+=s.level*w; for(let i=0;i<5;i++) chord[i]+=s.chord[i]*w; }
  if(tot<1e-4){ const s=AUDIO_MOODS.cosmos; root=s.root; bright=s.bright; level=s.level; for(let i=0;i<5;i++) chord[i]=s.chord[i]; tot=1; }
  root/=tot; bright/=tot; level/=tot; for(let i=0;i<5;i++) chord[i]/=tot;
  const t=ctx.currentTime, tc=0.4;
  AUDIO.filter.frequency.setTargetAtTime(bright, t, 0.6);
  for(let i=0;i<5;i++){ const v=AUDIO.voices[i];
    v.osc.frequency.setTargetAtTime(root*chord[i], t, tc);
    // gentle breathing per voice
    const breathe=0.6+0.4*Math.sin(TCLOCK.wall*0.13+i*1.7);
    v.g.gain.setTargetAtTime(level*0.05*breathe, t, tc); }
  AUDIO.sub.osc.frequency.setTargetAtTime(root*0.5, t, tc);
  AUDIO.sub.g.gain.setTargetAtTime(level*0.06, t, tc);
  // sound-design accents on key beats
  const beats=[ [0.275,'star'], [0.560,'ocean'], [0.665,'life'], [0.845,'spark'] ];
  for(const [bt,name] of beats){
    if(AUDIO.lastAccent!==name && pt>=bt && pt<bt+0.01){
      AUDIO.lastAccent=name;
      audioAccent(root*(name==='spark'?4:name==='life'?3:2), t);
    }
  }
  if(pt<0.05) AUDIO.lastAccent=-1; // rearm each loop
}

/* --------------------------------------------------------------------- [MAIN] */
let lastNow=0, acc=0;
const FIXED=1/60;
let paused=false;
let started=false;

function renderCosmosMovement(p, weight, aspect){
  const camParams = cosmosCamera(p);
  const proj = M4.perspective(50*Math.PI/180, aspect, 0.02, 100);
  const view = M4.lookAt(camParams.eye, camParams.tgt, [0,1,0]);
  const cam = { viewProj: M4.mul(proj, view), eye:camParams.eye };
  const env = computeCosmosEnv(p);
  env.fade *= weight; env.cmb *= weight; env.afterglow *= weight;
  renderCosmos(env, cam);
}
function renderLife(p, weight, aspect){ if(typeof LIFE!=='undefined' && LIFE.ready) LIFE.render(p,weight,aspect); }
function renderMind(p, weight, aspect){ if(typeof MIND!=='undefined' && MIND.ready) MIND.render(p,weight,aspect); }
function renderSingularity(pt){
  // The loop bridge: at the very end a single point flares (a star through a
  // telescope), whites out, and re-emerges as the Big Bang at pt 0. Because both
  // endpoints resolve to the same centred white bloom, the loop is seamless.
  const rampUp = smoothstep(0.965,1.0,pt);          // end of Mind -> collapse to a point
  const rampDn = 1.0 - smoothstep(0.0,0.038,pt);    // start of Cosmos -> fireball expands
  const flash = Math.max(rampUp, rampDn);
  if(flash<=0.001) return;
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE);
  fsPass(MATTER.starProg, sceneFBO, pr=>{
    gl.uniform2f(pr.u('uStar'), 0.5, 0.5);
    gl.uniform1f(pr.u('uSize'), mix(0.018, 0.42, flash*flash));
    gl.uniform1f(pr.u('uAspect'), sceneFBO.w/sceneFBO.h);
    gl.uniform1f(pr.u('uIntensity'), mix(0.2, 5.2, flash));
    gl.uniform1f(pr.u('uRays'), 0.6*(1.0-flash));
    gl.uniform3fv(pr.u('uColor'), [1.0, 0.96, 0.92]);
    gl.uniform1f(pr.u('uTime'), TCLOCK.sim);
  });
}

function frame(now){
  requestAnimationFrame(frame);
  if(paused) { lastNow=now; return; }
  let dt=(now-lastNow)/1000; if(!isFinite(dt)||dt<0) dt=0; if(dt>0.1) dt=0.1;
  lastNow=now;
  dt*=CFG.DEV_SPEED;
  TCLOCK.wall += dt;
  acc+=dt;
  while(acc>=FIXED){ TCLOCK.sim+=FIXED; acc-=FIXED; }
  TCLOCK.t = (TCLOCK.t + dt/CFG.DURATION) % 1.0;
  const pt = TCLOCK.t;

  // ---- render: composite all active movements into one HDR buffer ----
  gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFBO.fb);
  gl.viewport(0,0,sceneFBO.w,sceneFBO.h);
  gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  const aspect = sceneFBO.w/sceneFBO.h;

  for(const m of MOVEMENTS){
    const {w,p} = movWeight(m, pt);
    if(w<=0.001) continue;
    if(m.name==='cosmos') renderCosmosMovement(p, w, aspect);
    else if(m.name==='matter') renderMatter(p, w, aspect);
    else if(m.name==='life') renderLife(p, w, aspect);
    else if(m.name==='mind') renderMind(p, w, aspect);
  }
  renderSingularity(pt);

  runBloom();
  composite(computeGrade(pt));

  updateClock(pt);
  updateCaptions(pt);
  updateAudio(pt);
}

function resize(){
  const dpr=Math.min(window.devicePixelRatio||1, CFG.DPR_CAP);
  const w=Math.floor(window.innerWidth*dpr);
  const h=Math.floor(window.innerHeight*dpr);
  canvas.width=w; canvas.height=h;
  const rw=Math.floor(w*CFG.renderScale), rh=Math.floor(h*CFG.renderScale);
  allocTargets(rw, rh);
}

function fatal(msg){
  const m=document.getElementById('msg');
  m.textContent=msg; m.style.opacity=1;
}

function boot(){
  if(!initGL()){ fatal('This piece needs a WebGL2-capable browser'); return; }
  try{
    applyTier(detectTier(gl));
    emptyVAO=gl.createVertexArray();
    initPost();
    buildCosmos();
    buildMatter();
    buildLife();
    buildMind();
    resize();
    initAudio();
  }catch(e){
    console.error(e);
    fatal('GENESIS could not initialise on this device');
    return;
  }
  window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', ()=>{
    paused=document.hidden; if(!paused){ lastNow=performance.now(); audioResume(); }
  });
  // audio may only start on an incidental gesture — never required, never prompted
  const wake=()=>{ audioResume(); };
  window.addEventListener('pointerdown', wake, {passive:true});
  window.addEventListener('keydown', wake);
  window.addEventListener('touchstart', wake, {passive:true});
  // best-effort silent attempt (permissive environments only)
  setTimeout(audioResume, 400);
  canvas.addEventListener('webglcontextlost', (e)=>{ e.preventDefault(); paused=true; }, false);
  canvas.addEventListener('webglcontextrestored', ()=>{
    try{ GLC={floatColor:false,halfFloat:false,colorType:0};
      const extF=gl.getExtension('EXT_color_buffer_float'); const extHF=gl.getExtension('EXT_color_buffer_half_float');
      GLC.colorType = (extF||extHF)? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;
      emptyVAO=gl.createVertexArray(); initPost();
      buildCosmos(); buildMatter(); buildLife(); buildMind();
      sceneFBO=null; bloomChain=[]; resize();
      LIFE.seeded=false; LIFE.agentsInit=false;
      paused=false; lastNow=performance.now();
    }catch(err){ console.error(err); }
  }, false);
  started=true;
  lastNow=performance.now();
  requestAnimationFrame(frame);
}
boot();
</script>
