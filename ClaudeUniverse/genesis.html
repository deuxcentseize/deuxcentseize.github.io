<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GENESIS</title>
<style>
  :root{ --accent: #ffcf7a; }
  html,body{ margin:0; padding:0; height:100%; background:#000; overflow:hidden; }
  #stage{ position:fixed; inset:0; width:100vw; height:100vh; background:#000; }
  canvas{ display:block; width:100%; height:100%; }

  /* ---- Overlay UI: the ONLY on-screen elements ---- */
  #overlay{
    position:fixed; inset:0; pointer-events:none; z-index:5;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color:#fff;
  }
  /* Caption — planetarium register */
  #caption{
    position:absolute; left:50%; bottom:15.5%; transform:translateX(-50%);
    text-align:center; width:min(86vw, 900px);
    font-size:clamp(12px, 1.55vw, 21px);
    font-weight:300; letter-spacing:0.42em;
    text-transform:uppercase; font-variant:small-caps;
    color:rgba(245,245,255,0.92);
    text-shadow:0 0 22px rgba(120,150,220,0.35), 0 1px 2px rgba(0,0,0,0.6);
    opacity:0; transition:opacity 1.15s ease;
    line-height:1.7;
  }
  #caption .sub{
    display:block; margin-top:0.9em;
    font-size:0.66em; letter-spacing:0.30em; font-weight:300;
    color:rgba(210,215,235,0.62); text-transform:none; font-variant:normal;
  }

  /* Cosmic clock — logarithmic time ribbon, the sole persistent HUD */
  #clock{
    position:absolute; left:50%; bottom:5.4%; transform:translateX(-50%);
    width:min(62vw, 640px); opacity:0.0; transition:opacity 2s ease;
  }
  #clock .track{
    position:relative; height:1px; width:100%;
    background:linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.16), rgba(255,255,255,0.02));
  }
  #clock .prog{
    position:absolute; top:-1px; left:0; height:3px; width:0%;
    background:linear-gradient(90deg, rgba(255,255,255,0.0), var(--accent));
    box-shadow:0 0 10px var(--accent); border-radius:2px;
    opacity:0.85;
  }
  #clock .prog::after{
    content:''; position:absolute; right:-2px; top:-2px; width:5px; height:5px; border-radius:50%;
    background:var(--accent); box-shadow:0 0 12px 2px var(--accent);
  }
  #clock .label{
    margin-top:9px; display:flex; justify-content:space-between; align-items:baseline;
    font-size:clamp(9px,0.86vw,12px); font-weight:300; letter-spacing:0.24em;
    color:rgba(220,225,245,0.5); text-transform:uppercase;
  }
  #clock .label .t{ color:rgba(235,240,255,0.78); letter-spacing:0.16em; font-variant-numeric:tabular-nums; }
  #clock .label .era{ color:rgba(210,215,240,0.44); }

  /* Title / fatal message */
  #msg{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    text-align:center; color:rgba(230,235,255,0.85); font-weight:300; letter-spacing:0.35em;
    text-transform:uppercase; font-size:clamp(12px,1.5vw,18px); width:80vw;
    opacity:0; transition:opacity 1.6s ease;
  }
  .grain-off #clock, .grain-off #caption{ }
</style>
</head>
<body>
<div id="stage"><canvas id="gl"></canvas></div>
<div id="overlay">
  <div id="msg"></div>
  <div id="caption"><span class="main"></span></div>
  <div id="clock">
    <div class="track"><div class="prog"></div></div>
    <div class="label"><span class="t">t = 0</span><span class="era">THE PLANCK EPOCH</span></div>
  </div>
</div>

<script>
"use strict";
/* ============================================================================
   GENESIS — a self-running cinematic simulation of the universe.
   Single file, client-side, WebGL2. From first light to first mind, one shot.
   ----------------------------------------------------------------------------
   Module map (all within this file):
     [CONFIG]    constants, tiers
     [RNG/NOISE] deterministic PRNG + value noise / fbm (CPU)
     [MATH]      vec3 / mat4 / camera helpers
     [GL]        context, shader/program/texture/fbo helpers, fullscreen pass
     [POST]      HDR bright-pass -> bloom -> ACES tonemap -> grade -> vignette/grain/CA
     [COSMOS]    Movement I — Zel'dovich cosmic web, blackbody, first stars, CMB
     [MATTER]    Movement II — disk + planet  (added later)
     [LIFE]      Movement III — reaction-diffusion + protocells (added later)
     [MIND]      Movement IV — growing filament graph (added later)
     [SEQ]       director: timeline, camera spline, envelopes, captions, clock
     [MAIN]      fixed-timestep loop, resize, visibility, context-loss
   ========================================================================== */

/* ------------------------------------------------------------------ [CONFIG] */
const CFG = {
  SEED: 0x9e3779b9 >>> 0,
  DURATION: 300.0,        // seconds for one full loop of the piece (~5 min)
  DEV_SPEED: 1.0,         // time multiplier (tweak while developing)
  DPR_CAP: 1.75,
  BLOOM_LEVELS: 6,
  tier: 'high',           // 'high' | 'mid' | 'low' — set by detectTier()
  particles: 220000,      // cosmos particle count (set by tier)
  renderScale: 1.0,
};

function detectTier(gl){
  let tier = 'high';
  try{
    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
    const r = dbg ? (gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)||'') : '';
    const rl = (''+r).toLowerCase();
    if(/(intel|swiftshader|llvmpipe|software|microsoft basic)/.test(rl) &&
       !/(iris|arc|xe)/.test(rl)) tier = 'mid';
    if(/(swiftshader|llvmpipe|software|microsoft basic)/.test(rl)) tier = 'low';
  }catch(e){}
  const mem = navigator.deviceMemory || 8;
  const cores = navigator.hardwareConcurrency || 8;
  if(mem <= 4 || cores <= 4){ if(tier==='high') tier='mid'; }
  return tier;
}
function applyTier(t){
  CFG.tier = t;
  if(t==='high'){ CFG.particles=240000; CFG.renderScale=1.0;  CFG.BLOOM_LEVELS=6; CFG.DPR_CAP=1.75; }
  if(t==='mid') { CFG.particles=120000; CFG.renderScale=0.85; CFG.BLOOM_LEVELS=5; CFG.DPR_CAP=1.4;  }
  if(t==='low') { CFG.particles=45000;  CFG.renderScale=0.65; CFG.BLOOM_LEVELS=4; CFG.DPR_CAP=1.0;  }
}

/* --------------------------------------------------------------- [RNG/NOISE] */
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let RND = mulberry32(CFG.SEED);
const rand = ()=>RND();
const randRange = (a,b)=>a+(b-a)*RND();

// hashed lattice value noise (deterministic, seed-mixed)
function hash3i(x,y,z){
  let h = (x*374761393 + y*668265263 + z*2147483647 + (CFG.SEED|0)) | 0;
  h = Math.imul(h ^ (h>>>13), 1274126177);
  h ^= h>>>16;
  return (h>>>0)/4294967296;
}
function smoother(t){ return t*t*t*(t*(t*6-15)+10); }
function vnoise3(x,y,z){
  const xi=Math.floor(x), yi=Math.floor(y), zi=Math.floor(z);
  const xf=x-xi, yf=y-yi, zf=z-zi;
  const u=smoother(xf), v=smoother(yf), w=smoother(zf);
  function L(a,b,t){ return a+(b-a)*t; }
  const c000=hash3i(xi,yi,zi),     c100=hash3i(xi+1,yi,zi);
  const c010=hash3i(xi,yi+1,zi),   c110=hash3i(xi+1,yi+1,zi);
  const c001=hash3i(xi,yi,zi+1),   c101=hash3i(xi+1,yi,zi+1);
  const c011=hash3i(xi,yi+1,zi+1), c111=hash3i(xi+1,yi+1,zi+1);
  const x00=L(c000,c100,u), x10=L(c010,c110,u), x01=L(c001,c101,u), x11=L(c011,c111,u);
  const y0=L(x00,x10,v), y1=L(x01,x11,v);
  return L(y0,y1,w)*2.0-1.0;
}
function fbm3(x,y,z,oct=4){
  let a=0.5, f=1.0, s=0.0, n=0.0;
  for(let i=0;i<oct;i++){ s += a*vnoise3(x*f,y*f,z*f); n+=a; a*=0.5; f*=2.02; }
  return s/n;
}

/* -------------------------------------------------------------------- [MATH] */
const V3 = {
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  scale:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]],
  len:(a)=>Math.hypot(a[0],a[1],a[2]),
  norm:(a)=>{ const l=Math.hypot(a[0],a[1],a[2])||1; return [a[0]/l,a[1]/l,a[2]/l]; },
  lerp:(a,b,t)=>[a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t],
};
const M4 = {
  perspective(fovy, aspect, near, far){
    const f = 1.0/Math.tan(fovy/2), nf = 1.0/(near-far);
    return new Float32Array([
      f/aspect,0,0,0,  0,f,0,0,
      0,0,(far+near)*nf,-1,  0,0,(2*far*near)*nf,0]);
  },
  lookAt(eye, center, up){
    let z = V3.norm(V3.sub(eye,center));
    let x = V3.norm(V3.cross(up,z));
    let y = V3.cross(z,x);
    return new Float32Array([
      x[0],y[0],z[0],0,
      x[1],y[1],z[1],0,
      x[2],y[2],z[2],0,
      -V3.dot(x,eye),-V3.dot(y,eye),-V3.dot(z,eye),1]);
  },
  mul(a,b){ // a*b, column-major
    const o=new Float32Array(16);
    for(let c=0;c<4;c++)for(let r=0;r<4;r++){
      let s=0; for(let k=0;k<4;k++) s+=a[k*4+r]*b[c*4+k];
      o[c*4+r]=s;
    }
    return o;
  },
  invert(m){
    const o=new Float32Array(16);
    const a00=m[0],a01=m[1],a02=m[2],a03=m[3],
          a10=m[4],a11=m[5],a12=m[6],a13=m[7],
          a20=m[8],a21=m[9],a22=m[10],a23=m[11],
          a30=m[12],a31=m[13],a32=m[14],a33=m[15];
    const b00=a00*a11-a01*a10, b01=a00*a12-a02*a10, b02=a00*a13-a03*a10,
          b03=a01*a12-a02*a11, b04=a01*a13-a03*a11, b05=a02*a13-a03*a12,
          b06=a20*a31-a21*a30, b07=a20*a32-a22*a30, b08=a20*a33-a23*a30,
          b09=a21*a32-a22*a31, b10=a21*a33-a23*a31, b11=a22*a33-a23*a32;
    let det=b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06;
    if(!det) return o; det=1.0/det;
    o[0]=(a11*b11-a12*b10+a13*b09)*det; o[1]=(a02*b10-a01*b11-a03*b09)*det;
    o[2]=(a31*b05-a32*b04+a33*b03)*det; o[3]=(a22*b04-a21*b05-a23*b03)*det;
    o[4]=(a12*b08-a10*b11-a13*b07)*det; o[5]=(a00*b11-a02*b08+a03*b07)*det;
    o[6]=(a32*b02-a30*b05-a33*b01)*det; o[7]=(a20*b05-a22*b02+a23*b01)*det;
    o[8]=(a10*b10-a11*b08+a13*b06)*det; o[9]=(a01*b08-a00*b10-a03*b06)*det;
    o[10]=(a30*b04-a31*b02+a33*b00)*det; o[11]=(a21*b02-a20*b04-a23*b00)*det;
    o[12]=(a11*b07-a10*b09-a12*b06)*det; o[13]=(a00*b09-a01*b07+a02*b06)*det;
    o[14]=(a31*b01-a30*b03-a32*b00)*det; o[15]=(a20*b03-a21*b01+a22*b00)*det;
    return o;
  }
};
function blackbodyRGB(tK){
  let t=Math.max(1000,Math.min(40000,tK))/100, r,g,b;
  if(t<=66) r=255; else r=329.698727446*Math.pow(t-60,-0.1332047592);
  if(t<=66) g=99.4708025861*Math.log(t)-161.1195681661; else g=288.1221695283*Math.pow(t-60,-0.0755148492);
  if(t>=66) b=255; else if(t<=19) b=0; else b=138.5177312231*Math.log(t-10)-305.0447927307;
  const c=(x)=>Math.max(0,Math.min(255,x))/255;
  return [c(r),c(g),c(b)];
}
function ease(t){ return t<=0?0:t>=1?1:t*t*(3-2*t); }        // smoothstep
function easeIn(t){ return t*t; }
function easeOut(t){ return 1-(1-t)*(1-t); }
function clamp(x,a,b){ return x<a?a:x>b?b:x; }
function smoothstep(a,b,x){ const t=clamp((x-a)/(b-a||1e-6),0,1); return t*t*(3-2*t); }
function mix(a,b,t){ return a+(b-a)*t; }

/* ---------------------------------------------------------------------- [GL] */
const canvas = document.getElementById('gl');
let gl = null;
let GLC = { floatColor:false, halfFloat:false, colorType:0 };

function initGL(){
  const opts = { antialias:false, alpha:false, depth:true, stencil:false,
                 premultipliedAlpha:false, preserveDrawingBuffer:true,
                 powerPreference:'high-performance', desynchronized:true };
  gl = canvas.getContext('webgl2', opts);
  if(!gl){ return false; }
  const extF  = gl.getExtension('EXT_color_buffer_float');
  const extHF = gl.getExtension('EXT_color_buffer_half_float');
  gl.getExtension('OES_texture_float_linear');
  gl.getExtension('EXT_float_blend');
  if(extF){ GLC.floatColor=true; GLC.colorType = gl.HALF_FLOAT; }
  else if(extHF){ GLC.halfFloat=true; GLC.colorType = gl.HALF_FLOAT; }
  else { GLC.colorType = gl.UNSIGNED_BYTE; }
  return true;
}

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
    const log = gl.getShaderInfoLog(s);
    console.error('Shader compile error:\n'+log+'\n----\n'+numberSrc(src));
    throw new Error('shader compile: '+log);
  }
  return s;
}
function numberSrc(src){ return src.split('\n').map((l,i)=>(i+1)+': '+l).join('\n'); }
function program(vsSrc, fsSrc, name){
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vsSrc));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsSrc));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)){
    throw new Error('link '+(name||'')+': '+gl.getProgramInfoLog(p));
  }
  // cache uniform locations lazily
  p._u = {};
  p.u = function(n){ let l=p._u[n]; if(l===undefined){ l=gl.getUniformLocation(p,n); p._u[n]=l; } return l; };
  return p;
}

function createTex(w,h,type,filter){
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  const internal = (type===gl.HALF_FLOAT) ? gl.RGBA16F : gl.RGBA8;
  gl.texImage2D(gl.TEXTURE_2D,0,internal,w,h,0,gl.RGBA,type,null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter||gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter||gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  t._w=w; t._h=h; t._type=type;
  return t;
}
function createFBO(w,h,type,filter){
  const tex = createTex(w,h,type||GLC.colorType,filter);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  const o = { fb, tex, w, h };
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return o;
}
function resizeFBO(o,w,h){
  if(o.w===w && o.h===h) return o;
  gl.deleteTexture(o.tex); gl.deleteFramebuffer(o.fb);
  const n = createFBO(w,h,o.tex._type);
  o.fb=n.fb; o.tex=n.tex; o.w=w; o.h=h; return o;
}

// attributeless fullscreen triangle
let emptyVAO=null;
const FS_VS = `#version 300 es
precision highp float;
out vec2 vUv;
void main(){
  vec2 p = vec2(float((gl_VertexID<<1)&2), float(gl_VertexID&2));
  vUv = p;
  gl_Position = vec4(p*2.0-1.0, 0.0, 1.0);
}`;
function fsPass(prog, target, setU){
  if(target){ gl.bindFramebuffer(gl.FRAMEBUFFER, target.fb); gl.viewport(0,0,target.w,target.h); }
  else { gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0,0,gl.drawingBufferWidth, gl.drawingBufferHeight); }
  gl.useProgram(prog);
  gl.bindVertexArray(emptyVAO);
  if(setU) setU(prog);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

/* -------------------------------------------------------------------- [POST] */
// Shared GLSL snippets
const GLSL_COMMON = `
vec3 aces(vec3 x){
  const float a=2.51,b=0.03,c=2.43,d=0.59,e=0.14;
  return clamp((x*(a*x+b))/(x*(c*x+d)+e),0.0,1.0);
}
float luma(vec3 c){ return dot(c, vec3(0.2126,0.7152,0.0722)); }
float hash21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float hash13(vec3 p){ p=fract(p*0.1031); p+=dot(p,p.zyx+31.32); return fract((p.x+p.y)*p.z); }
float vnoise3(vec3 p){
  vec3 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
  float n000=hash13(i), n100=hash13(i+vec3(1,0,0));
  float n010=hash13(i+vec3(0,1,0)), n110=hash13(i+vec3(1,1,0));
  float n001=hash13(i+vec3(0,0,1)), n101=hash13(i+vec3(1,0,1));
  float n011=hash13(i+vec3(0,1,1)), n111=hash13(i+vec3(1,1,1));
  return mix(mix(mix(n000,n100,f.x),mix(n010,n110,f.x),f.y),
             mix(mix(n001,n101,f.x),mix(n011,n111,f.x),f.y),f.z)*2.0-1.0;
}
float fbm3g(vec3 p){ float s=0.0,a=0.5; for(int i=0;i<5;i++){ s+=a*vnoise3(p); p*=2.03; a*=0.5;} return s; }
`;

let POST = {};
function initPost(){
  // bright pass (threshold + soft knee), writes to bloom[0]
  POST.bright = program(FS_VS, `#version 300 es
  precision highp float;
  in vec2 vUv; out vec4 o;
  uniform sampler2D uScene; uniform float uThreshold; uniform float uKnee;
  ${GLSL_COMMON}
  void main(){
    vec3 c = texture(uScene, vUv).rgb;
    float br = max(max(c.r,c.g),c.b);
    float knee = uKnee;
    float soft = clamp(br - uThreshold + knee, 0.0, 2.0*knee);
    soft = soft*soft/(4.0*knee+1e-4);
    float contrib = max(soft, br - uThreshold)/max(br,1e-4);
    o = vec4(c*contrib, 1.0);
  }`, 'bright');

  POST.down = program(FS_VS, `#version 300 es
  precision highp float;
  in vec2 vUv; out vec4 o;
  uniform sampler2D uTex; uniform vec2 uHalfPixel;
  void main(){
    vec2 h=uHalfPixel;
    vec4 s = texture(uTex,vUv)*4.0;
    s += texture(uTex, vUv - h);
    s += texture(uTex, vUv + h);
    s += texture(uTex, vUv + vec2(h.x,-h.y));
    s += texture(uTex, vUv - vec2(h.x,-h.y));
    o = s/8.0;
  }`, 'down');

  POST.up = program(FS_VS, `#version 300 es
  precision highp float;
  in vec2 vUv; out vec4 o;
  uniform sampler2D uTex; uniform vec2 uHalfPixel;
  void main(){
    vec2 h=uHalfPixel;
    vec4 s = texture(uTex, vUv + vec2(-h.x*2.0, 0.0));
    s += texture(uTex, vUv + vec2(-h.x, h.y))*2.0;
    s += texture(uTex, vUv + vec2(0.0, h.y*2.0));
    s += texture(uTex, vUv + vec2(h.x, h.y))*2.0;
    s += texture(uTex, vUv + vec2(h.x*2.0, 0.0));
    s += texture(uTex, vUv + vec2(h.x, -h.y))*2.0;
    s += texture(uTex, vUv + vec2(0.0, -h.y*2.0));
    s += texture(uTex, vUv + vec2(-h.x, -h.y))*2.0;
    o = s/12.0;
  }`, 'up');

  // final composite: scene + bloom, ACES, grade, vignette, grain, chromatic aberration
  POST.composite = program(FS_VS, `#version 300 es
  precision highp float;
  in vec2 vUv; out vec4 o;
  uniform sampler2D uScene, uBloom;
  uniform vec2 uRes;
  uniform float uExposure, uBloomAmt, uVignette, uGrain, uCA, uTime, uGradeAmt;
  uniform vec3 uLift, uGamma, uGain, uShadowTint, uHiTint;
  ${GLSL_COMMON}
  void main(){
    vec2 uv = vUv;
    // chromatic aberration toward edges
    vec2 dir = uv-0.5;
    float r2 = dot(dir,dir);
    float ca = uCA * r2;
    vec3 col;
    col.r = texture(uScene, uv - dir*ca).r;
    col.g = texture(uScene, uv).g;
    col.b = texture(uScene, uv + dir*ca).b;
    vec3 bloom = texture(uBloom, uv).rgb;
    col += bloom * uBloomAmt;

    col *= uExposure;
    col = aces(col);

    // color grade — lift/gamma/gain + a shadow->highlight tint (the "one sunrise")
    col = col*uGain + uLift;
    col = pow(max(col,0.0), 1.0/max(uGamma,vec3(0.01)));
    float L = luma(col);
    vec3 tint = mix(uShadowTint, uHiTint, smoothstep(0.0,0.9,L));
    col = mix(col, col*tint, uGradeAmt);

    // vignette
    float vig = smoothstep(0.95, 0.35, length(dir)*1.35);
    col *= mix(1.0, vig, uVignette);

    // animated film grain
    float g = hash21(uv*uRes + fract(uTime)*vec2(571.0,197.0));
    col += (g-0.5)*uGrain;

    // subtle output dither
    col += (hash21(uv*uRes+0.5)-0.5)/255.0;
    o = vec4(clamp(col,0.0,1.0), 1.0);
  }`, 'composite');
}

/* Render buffers */
let sceneFBO=null, bloomChain=[];
let RW=1, RH=1;
function allocTargets(w,h){
  RW=Math.max(2,w|0); RH=Math.max(2,h|0);
  if(!sceneFBO) sceneFBO = createFBO(RW,RH,GLC.colorType);
  else resizeFBO(sceneFBO, RW, RH);
  // bloom chain
  for(const b of bloomChain){ gl.deleteTexture(b.tex); gl.deleteFramebuffer(b.fb); }
  bloomChain=[];
  let w2=RW, h2=RH;
  for(let i=0;i<CFG.BLOOM_LEVELS;i++){
    w2=Math.max(2, w2>>1); h2=Math.max(2, h2>>1);
    bloomChain.push(createFBO(w2,h2,GLC.colorType));
  }
}
function runBloom(){
  gl.disable(gl.BLEND);
  // bright pass -> bloom[0]
  fsPass(POST.bright, bloomChain[0], p=>{
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sceneFBO.tex);
    gl.uniform1i(p.u('uScene'),0);
    gl.uniform1f(p.u('uThreshold'), 0.62);
    gl.uniform1f(p.u('uKnee'), 0.55);
  });
  // downsample chain
  for(let i=1;i<bloomChain.length;i++){
    const src=bloomChain[i-1], dst=bloomChain[i];
    fsPass(POST.down, dst, p=>{
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, src.tex);
      gl.uniform1i(p.u('uTex'),0);
      gl.uniform2f(p.u('uHalfPixel'), 0.5/src.w, 0.5/src.h);
    });
  }
  // upsample + additive accumulate
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  for(let i=bloomChain.length-2;i>=0;i--){
    const src=bloomChain[i+1], dst=bloomChain[i];
    fsPass(POST.up, dst, p=>{
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, src.tex);
      gl.uniform1i(p.u('uTex'),0);
      gl.uniform2f(p.u('uHalfPixel'), 0.5/src.w, 0.5/src.h);
    });
  }
  gl.disable(gl.BLEND);
}
function composite(grade){
  fsPass(POST.composite, null, p=>{
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sceneFBO.tex); gl.uniform1i(p.u('uScene'),0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, bloomChain[0].tex); gl.uniform1i(p.u('uBloom'),1);
    gl.uniform2f(p.u('uRes'), gl.drawingBufferWidth, gl.drawingBufferHeight);
    gl.uniform1f(p.u('uExposure'), grade.exposure);
    gl.uniform1f(p.u('uBloomAmt'), grade.bloom);
    gl.uniform1f(p.u('uVignette'), grade.vignette);
    gl.uniform1f(p.u('uGrain'), grade.grain);
    gl.uniform1f(p.u('uCA'), grade.ca);
    gl.uniform1f(p.u('uTime'), TCLOCK.wall);
    gl.uniform1f(p.u('uGradeAmt'), grade.gradeAmt);
    gl.uniform3fv(p.u('uLift'), grade.lift);
    gl.uniform3fv(p.u('uGamma'), grade.gamma);
    gl.uniform3fv(p.u('uGain'), grade.gain);
    gl.uniform3fv(p.u('uShadowTint'), grade.shadowTint);
    gl.uniform3fv(p.u('uHiTint'), grade.hiTint);
  });
}

/* ------------------------------------------------------------------ [COSMOS] */
const COSMOS = {
  prog:null, vao:null, buf:null, count:0, S:1.6, lineageIdx:0,
  lineagePos:[0,0,0],
};
function buildCosmos(){
  // Zel'dovich needs a REGULAR lattice so coherent displacement folds into
  // caustics (filaments / voids). Jitter the lattice enough to hide the grid
  // at growth 0, but not so much that the caustics blur out.
  const gridN = Math.max(10, Math.round(Math.cbrt(CFG.particles)));
  const N = gridN*gridN*gridN;
  CFG.particles = N;
  const S = COSMOS.S;
  const data = new Float32Array(N*9); // q(3) psi(3) density rnd lineage
  const finals = new Float32Array(N*3);
  const spacing = (2*S)/gridN;
  const jit = 0.40*spacing;
  const NF = 1.45;   // controls how many filaments span the box
  const DMAX = 0.80; // displacement strength (world units per unit gradient)
  const MAXDISP = 0.45; // cap so streams stay coherent
  const eps = 0.045;
  const phi = (x,y,z)=>fbm3(x*NF, y*NF, z*NF, 5);
  let i=0;
  for(let a=0;a<gridN;a++)for(let b=0;b<gridN;b++)for(let c=0;c<gridN;c++){
    const qx=-S+(a+0.5)*spacing+(rand()*2-1)*jit;
    const qy=-S+(b+0.5)*spacing+(rand()*2-1)*jit;
    const qz=-S+(c+0.5)*spacing+(rand()*2-1)*jit;
    // displacement psi = -grad(potential)  (finite differences)
    const gx=(phi(qx+eps,qy,qz)-phi(qx-eps,qy,qz))/(2*eps);
    const gy=(phi(qx,qy+eps,qz)-phi(qx,qy-eps,qz))/(2*eps);
    const gz=(phi(qx,qy,qz+eps)-phi(qx,qy,qz-eps))/(2*eps);
    let px=-gx*DMAX, py=-gy*DMAX, pz=-gz*DMAX;
    const pl=Math.hypot(px,py,pz)||1; if(pl>MAXDISP){ const s=MAXDISP/pl; px*=s; py*=s; pz*=s; }
    const o=i*9;
    data[o]=qx; data[o+1]=qy; data[o+2]=qz;
    data[o+3]=px; data[o+4]=py; data[o+5]=pz;
    data[o+6]=0; data[o+7]=rand(); data[o+8]=0;
    finals[i*3]=qx+px; finals[i*3+1]=qy+py; finals[i*3+2]=qz+pz;
    i++;
  }
  // 2) density estimate: bin final positions, count neighbours in a grid
  const G=48; const cell=(2*S)/G;
  const grid=new Int32Array(G*G*G);
  const gi=(x)=>clamp(Math.floor((x+S)/cell),0,G-1);
  for(let i=0;i<N;i++){
    const ix=gi(finals[i*3]), iy=gi(finals[i*3+1]), iz=gi(finals[i*3+2]);
    grid[(ix*G+iy)*G+iz]++;
  }
  let maxc=1;
  for(let i=0;i<grid.length;i++) if(grid[i]>maxc) maxc=grid[i];
  for(let i=0;i<N;i++){
    const ix=gi(finals[i*3]), iy=gi(finals[i*3+1]), iz=gi(finals[i*3+2]);
    const c=grid[(ix*G+iy)*G+iz];
    data[i*9+6]=Math.pow(c/maxc, 0.6); // density 0..1, gamma for spread
  }
  // 3) pick the lineage mote: a high-density particle near frame centre-ish
  let best=-1, bestScore=-1;
  for(let i=0;i<N;i++){
    const d=data[i*9+6];
    const fx=finals[i*3], fy=finals[i*3+1], fz=finals[i*3+2];
    const centered = 1.0 - Math.min(1, Math.hypot(fx,fy,fz)/(S*1.2));
    const score = d*0.7 + centered*0.3*rand();
    if(d>0.55 && score>bestScore){ bestScore=score; best=i; }
  }
  if(best<0) best=0;
  data[best*9+8]=1.0; // lineage flag
  COSMOS.lineageIdx=best;
  COSMOS.lineageFinal=[finals[best*3],finals[best*3+1],finals[best*3+2]];

  // GPU upload
  const buf=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
  const vao=gl.createVertexArray();
  gl.bindVertexArray(vao);
  const stride=9*4;
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,3,gl.FLOAT,false,stride,0);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1,3,gl.FLOAT,false,stride,12);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2,1,gl.FLOAT,false,stride,24);
  gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3,1,gl.FLOAT,false,stride,28);
  gl.enableVertexAttribArray(4); gl.vertexAttribPointer(4,1,gl.FLOAT,false,stride,32);
  gl.bindVertexArray(null);

  COSMOS.buf=buf; COSMOS.vao=vao; COSMOS.count=N;

  COSMOS.prog = program(`#version 300 es
  precision highp float;
  layout(location=0) in vec3 aQ;
  layout(location=1) in vec3 aPsi;
  layout(location=2) in float aDensity;
  layout(location=3) in float aRnd;
  layout(location=4) in float aLineage;
  uniform mat4 uViewProj;
  uniform float uGrowth, uTempK, uStarIgnite, uPointScale, uTime, uFade, uColdWeb;
  uniform vec3 uAccent;
  out vec3 vCol; out float vBright; out float vLin;

  vec3 blackbody(float tK){
    float t = clamp(tK,1000.0,40000.0)/100.0;
    float r,g,b;
    if(t<=66.0) r=255.0; else r=329.698727446*pow(max(t-60.0,1e-3),-0.1332047592);
    if(t<=66.0) g=99.4708025861*log(t)-161.1195681661; else g=288.1221695283*pow(max(t-60.0,1e-3),-0.0755148492);
    if(t>=66.0) b=255.0; else if(t<=19.0) b=0.0; else b=138.5177312231*log(max(t-10.0,1e-3))-305.0447927307;
    return clamp(vec3(r,g,b)/255.0,0.0,1.0);
  }
  void main(){
    vec3 pos = aQ + aPsi*uGrowth;
    vec4 clip = uViewProj*vec4(pos,1.0);
    gl_Position = clip;
    float d = aDensity;
    // plasma phase colour from cooling blackbody, uniform-ish across field
    vec3 plasma = blackbody(uTempK) * (0.4 + 0.6*d);
    // as structure forms the neutral gas reads cold: dark violet voids -> brighter
    // indigo filaments (the cold, sparse first structure)
    vec3 cold = mix(vec3(0.10,0.09,0.22), vec3(0.42,0.40,0.98), smoothstep(0.15,0.95,d));
    vec3 base = mix(plasma, cold, uColdWeb);
    // first stars: high-density peaks ignite blue-white
    float starMask = smoothstep(0.6,0.88,d) * uStarIgnite;
    vec3 starCol = mix(vec3(0.72,0.83,1.0), vec3(1.0,0.96,0.85), aRnd);
    vec3 col = mix(base, starCol, starMask);
    float bright = mix((0.34+1.5*d*d)*mix(1.0,0.95,uColdWeb), 2.1+2.8*d, starMask);
    bright *= mix(0.6,1.0, uTempK>2.0e4?1.0:0.85); // hotter plasma a touch dimmer visually
    // twinkle for ignited stars
    bright *= 1.0 + 0.25*starMask*sin(uTime*3.0 + aRnd*30.0);

    // lineage mote — sacred accent, a quiet living presence we follow
    if(aLineage>0.5){ col = uAccent; bright = 1.7 + 0.5*sin(uTime*1.6); }

    vCol = col;
    vBright = bright*uFade;
    vLin = aLineage;
    float size = uPointScale*(0.6+2.0*d);
    if(aLineage>0.5) size = uPointScale*4.5;
    // perspective attenuation
    size *= 1.0/max(clip.w,0.15);
    gl_PointSize = clamp(size, 0.0, 64.0);
  }`,`#version 300 es
  precision highp float;
  in vec3 vCol; in float vBright; in float vLin;
  out vec4 o;
  void main(){
    vec2 pc = gl_PointCoord*2.0-1.0;
    float r = dot(pc,pc);
    if(r>1.0) discard;
    float core = exp(-r*3.5);
    float halo = exp(-r*1.2)*0.5;
    float a = core+halo;
    vec3 c = vCol*vBright*a;
    if(vLin>0.5){ c += vCol*core*1.5; } // brighter accent core
    o = vec4(c, 1.0);
  }`, 'cosmos');

  // CMB / background field pass
  COSMOS.bg = program(FS_VS, `#version 300 es
  precision highp float;
  in vec2 vUv; out vec4 o;
  uniform float uTime, uCmb, uAfterglow; uniform vec2 uRes; uniform vec3 uGlowCol;
  ${GLSL_COMMON}
  // cheap 2d value noise
  float n2(vec2 p){
    vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
    float a=hash21(i), b=hash21(i+vec2(1,0)), c=hash21(i+vec2(0,1)), d=hash21(i+vec2(1,1));
    return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);
  }
  float fbm(vec2 p){ float s=0.0,a=0.5; for(int i=0;i<5;i++){ s+=a*n2(p); p*=2.03; a*=0.5;} return s; }
  void main(){
    vec2 uv=vUv;
    vec2 p=(uv-0.5)*vec2(uRes.x/uRes.y,1.0);
    // mottled CMB temperature anisotropy
    float m = fbm(p*7.0 + 13.0) ;
    float m2 = fbm(p*18.0 - 5.0);
    float t = (m*0.7+m2*0.3);
    vec3 warm=vec3(1.0,0.55,0.2), cool=vec3(0.25,0.4,0.9);
    vec3 cmb = mix(cool,warm,smoothstep(0.35,0.75,t))*(0.5+0.7*t);
    cmb *= uCmb*0.05;
    // hot plasma afterglow: a luminous fireball fog, brighter at centre, cooling
    // through the blackbody ramp (uGlowCol) as the universe expands.
    float rad = exp(-dot(p,p)*0.7);
    float mott = 0.75 + 0.5*fbm(p*4.0+7.0);
    vec3 glow = uGlowCol*uAfterglow*(0.09 + 0.34*rad)*mott;
    o = vec4(cmb+glow, 1.0);
  }`, 'cosmos-bg');
}

function renderCosmos(env, cam){
  // background CMB / afterglow
  if(env.cmb>0.001 || env.afterglow>0.001){
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
    fsPass(COSMOS.bg, sceneFBO, p=>{
      gl.uniform1f(p.u('uTime'), TCLOCK.sim);
      gl.uniform1f(p.u('uCmb'), env.cmb);
      gl.uniform1f(p.u('uAfterglow'), env.afterglow);
      gl.uniform2f(p.u('uRes'), sceneFBO.w, sceneFBO.h);
      gl.uniform3fv(p.u('uGlowCol'), blackbodyRGB(env.tempK));
    });
  }
  // particles
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE); gl.disable(gl.DEPTH_TEST);
  gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFBO.fb); gl.viewport(0,0,sceneFBO.w,sceneFBO.h);
  gl.useProgram(COSMOS.prog);
  gl.bindVertexArray(COSMOS.vao);
  gl.uniformMatrix4fv(COSMOS.prog.u('uViewProj'), false, cam.viewProj);
  gl.uniform1f(COSMOS.prog.u('uGrowth'), env.growth);
  gl.uniform1f(COSMOS.prog.u('uTempK'), env.tempK);
  gl.uniform1f(COSMOS.prog.u('uStarIgnite'), env.starIgnite);
  gl.uniform1f(COSMOS.prog.u('uPointScale'), env.pointScale*sceneFBO.h/1080.0);
  gl.uniform1f(COSMOS.prog.u('uTime'), TCLOCK.sim);
  gl.uniform1f(COSMOS.prog.u('uFade'), env.fade);
  gl.uniform1f(COSMOS.prog.u('uColdWeb'), env.coldWeb);
  gl.uniform3fv(COSMOS.prog.u('uAccent'), ACCENT);
  gl.drawArrays(gl.POINTS, 0, COSMOS.count);
  gl.bindVertexArray(null);
}

/* ------------------------------------------------------------------ [MATTER] */
const MATTER = { diskProg:null, diskVao:null, diskCount:0, planetProg:null, starProg:null };
function buildMatter(){
  const nDisk = CFG.tier==='high'?70000 : CFG.tier==='mid'?34000 : 13000;
  const embryos = 3;
  const N = nDisk + embryos;
  const data = new Float32Array(N*5); // r, theta0, z, rnd, type
  const gapR = [0.34, 0.54, 0.74];
  for(let i=0;i<nDisk;i++){
    const u=rand();
    const r = 0.11 + 0.9*Math.pow(u,0.62);
    const o=i*5;
    data[o]=r;
    data[o+1]=rand()*Math.PI*2;
    data[o+2]=(rand()*2-1);
    data[o+3]=rand();
    // ~7% of particles are inward-accreting stream particles (filament echo)
    data[o+4]= (rand()<0.07 && r<0.75) ? 1.0 : 0.0;
  }
  for(let e=0;e<embryos;e++){
    const o=(nDisk+e)*5;
    data[o]=gapR[e]; data[o+1]=rand()*Math.PI*2; data[o+2]=0.0; data[o+3]=rand(); data[o+4]=2.0;
  }
  const buf=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
  const vao=gl.createVertexArray(); gl.bindVertexArray(vao);
  const stride=5*4;
  for(let a=0;a<5;a++){ gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a,1,gl.FLOAT,false,stride,a*4); }
  gl.bindVertexArray(null);
  MATTER.diskVao=vao; MATTER.diskCount=N;

  MATTER.diskProg = program(`#version 300 es
  precision highp float;
  layout(location=0) in float aR;
  layout(location=1) in float aTheta;
  layout(location=2) in float aZ;
  layout(location=3) in float aRnd;
  layout(location=4) in float aType;
  uniform mat4 uViewProj; uniform float uTime,uPointScale,uSpin,uGapGrow,uFade,uAccrete;
  uniform vec3 uAccent;
  out vec3 vCol; out float vB; out float vType;
  void main(){
    float r=aR;
    if(aType>0.5 && aType<1.5){ r=mix(aR,0.07,clamp(uAccrete*(0.35+0.65*aRnd),0.0,1.0)); }
    float ang=aTheta + uTime*uSpin/pow(max(r,0.05),1.5);
    float thick = 0.05 + 0.10*r;             // slightly flaring thin disk
    vec3 pos=vec3(cos(ang)*r, aZ*thick, sin(ang)*r);
    vec4 clip=uViewProj*vec4(pos,1.0); gl_Position=clip;
    float tR=smoothstep(0.95,0.08,r);        // 1 = inner/hot
    vec3 hot=mix(vec3(1.0,0.72,0.32), vec3(0.85,0.9,1.0), smoothstep(0.55,1.0,tR));
    vec3 outer=vec3(0.42,0.22,0.11);
    vec3 col=mix(outer,hot,tR);
    float spiral=0.5+0.5*sin(2.0*ang - 7.0*log(max(r,0.05)));
    spiral=pow(spiral,1.6);                    // sharpen arms
    float lane=0.6+0.4*sin(r*46.0 + aRnd*6.28);
    float dust=(0.35+0.85*spiral)*lane;
    float gap=1.0;
    gap*=mix(1.0, smoothstep(0.015,0.05,abs(r-0.34)), uGapGrow);
    gap*=mix(1.0, smoothstep(0.015,0.05,abs(r-0.54)), uGapGrow);
    gap*=mix(1.0, smoothstep(0.020,0.06,abs(r-0.74)), uGapGrow);
    float b=(0.35+1.7*tR)*dust*gap;
    float size=uPointScale*(0.5+1.4*tR);
    if(aType>0.5 && aType<1.5){ col=mix(col,uAccent,0.45); b*=1.7; size*=1.1; } // streams
    if(aType>1.5){ col=vec3(1.0,0.85,0.6); b=2.2*uGapGrow+0.3; size=uPointScale*3.2; } // embryos
    vType=aType;
    vCol=col; vB=b*uFade;
    size*=1.0/max(clip.w,0.15);
    gl_PointSize=clamp(size,0.0,64.0);
  }`,`#version 300 es
  precision highp float;
  in vec3 vCol; in float vB; in float vType; out vec4 o;
  void main(){
    vec2 pc=gl_PointCoord*2.0-1.0; float r=dot(pc,pc);
    if(r>1.0) discard;
    float core=exp(-r*3.2), halo=exp(-r*1.1)*0.5;
    o=vec4(vCol*vB*(core+halo),1.0);
  }`,'matter-disk');

  // protostar / star glow + god-rays + lens flare, screen-space additive
  MATTER.starProg = program(FS_VS, `#version 300 es
  precision highp float;
  in vec2 vUv; out vec4 o;
  uniform vec2 uStar; uniform float uSize,uAspect,uIntensity,uRays; uniform vec3 uColor; uniform float uTime;
  ${GLSL_COMMON}
  void main(){
    vec2 d=(vUv-uStar); d.x*=uAspect;
    float dist=length(d);
    float core=exp(-pow(dist/max(uSize,1e-3),2.0))*2.2;   // tight brilliant core
    float halo=exp(-dist/(uSize*7.0))*0.35;               // small tasteful halo
    float ang=atan(d.y,d.x);
    float rays=pow(max(0.0,cos(ang*3.0)),22.0)*exp(-dist*16.0)*uRays*0.28;
    float streak=exp(-abs(d.y)*220.0)*exp(-dist*5.0)*0.30*uRays;
    float v=(core+halo+rays+streak)*uIntensity;
    o=vec4(uColor*v,1.0);
  }`,'matter-star');

  // procedurally shaded planet (analytic ray-sphere)
  MATTER.planetProg = program(FS_VS, `#version 300 es
  precision highp float;
  in vec2 vUv; out vec4 o;
  uniform mat4 uInvVP; uniform vec3 uCamPos, uPlanetPos, uLightDir, uAccent;
  uniform float uRadius,uMagma,uSeaLevel,uCloud,uAtmo,uGreen,uTime,uFade;
  ${GLSL_COMMON}
  void main(){
    vec2 ndc=vUv*2.0-1.0;
    vec4 wn=uInvVP*vec4(ndc,-1.0,1.0); wn/=wn.w;
    vec4 wf=uInvVP*vec4(ndc, 1.0,1.0); wf/=wf.w;
    vec3 ro=uCamPos, rd=normalize(wf.xyz-wn.xyz);
    vec3 oc=ro-uPlanetPos;
    float b=dot(oc,rd), c=dot(oc,oc)-uRadius*uRadius, h=b*b-c;
    if(h<0.0){ o=vec4(0.0); return; }
    float t=-b-sqrt(h); if(t<0.0){ o=vec4(0.0); return; }
    vec3 pos=ro+rd*t; vec3 N=normalize(pos-uPlanetPos);
    vec3 L=-normalize(uLightDir);
    float ndl=max(dot(N,L),0.0);
    // terrain
    float elev=fbm3g(N*3.1)*0.5+0.5;
    elev=pow(elev,1.2);
    float land=smoothstep(uSeaLevel-0.03,uSeaLevel+0.03,elev);
    vec3 ocean=mix(vec3(0.015,0.10,0.22), vec3(0.06,0.28,0.46), elev);
    vec3 rock=mix(vec3(0.26,0.20,0.14), vec3(0.46,0.40,0.30), smoothstep(uSeaLevel,1.0,elev));
    vec3 green=mix(vec3(0.12,0.28,0.11), vec3(0.30,0.44,0.18), smoothstep(uSeaLevel,1.0,elev));
    vec3 landC=mix(rock,green,uGreen);
    vec3 surf=mix(ocean,landC,land);
    // magma phase
    float lava=fbm3g(N*5.0+vec3(0.0,uTime*0.04,0.0))*0.5+0.5;
    vec3 magma=mix(vec3(0.5,0.03,0.0), vec3(1.0,0.6,0.12), smoothstep(0.35,0.85,lava));
    surf=mix(surf,magma,uMagma);
    // day-side lighting with soft terminator + a little wrap light
    float lit = ndl + 0.10*max(dot(N,L)+0.35,0.0);
    vec3 col=surf*(0.05 + 1.55*lit);
    col+=magma*uMagma*(0.4+0.7*lava)*1.7;             // emissive lava
    // ocean specular sun-glint
    if(land<0.5 && uMagma<0.5){ vec3 R=reflect(-L,N); float s=pow(max(dot(R,rd),0.0),60.0);
      col+=vec3(0.9,0.95,1.0)*s*(1.0-uMagma)*1.5; }
    // clouds / steam
    float cl=fbm3g(N*3.6+vec3(uTime*0.02,0.0,0.0))*0.5+0.5;
    float clouds=smoothstep(0.55,0.78,cl)*uCloud;
    col=mix(col, vec3(1.0,1.0,1.03)*(0.1+1.3*ndl), clouds);
    // atmosphere: fresnel limb (steam grey -> blue sky) + day-side rayleigh glow
    float fres=pow(1.0-max(dot(N,-rd),0.0),3.0);
    vec3 atmoCol=mix(vec3(0.7,0.66,0.62), vec3(0.35,0.6,1.0), uAtmo);
    col+=atmoCol*fres*(0.25+0.9*ndl)*(0.6+0.7*uAtmo);
    col+=vec3(0.25,0.5,1.0)*uAtmo*pow(1.0-max(dot(N,-rd),0.0),1.5)*ndl*0.35;
    o=vec4(col*uFade,1.0);
  }`,'matter-planet');
}

// star world position over the movement: begins at the disk centre, then drifts to
// sit up-and-to-one-side of the camera so the planet's visible face is nicely lit.
function matterStarWorld(p, eye){
  const away = ease(clamp((p-0.45)/0.42,0,1));
  // rotate the camera direction around Y and lift it — light grazes the visible hemisphere
  const c=Math.cos(0.75), s=Math.sin(0.75);
  const dir=V3.norm([eye[0], eye[1], eye[2]]);
  const rot=[dir[0]*c+dir[2]*s, dir[1]+0.55, -dir[0]*s+dir[2]*c];
  const far=V3.scale(V3.norm(rot), 6.0);
  return V3.lerp([0,0,0], far, away);
}
function matterCamera(p){
  const dist = mix(3.3, 1.4, ease(p));
  const az = 0.4 + p*2.7;                       // spiral
  const el = mix(1.18, 0.12, ease(clamp(p/0.52,0,1))); // top-down -> edge-on -> low
  const tgt=[0,0,0];
  const eye=[Math.cos(az)*Math.cos(el)*dist, Math.sin(el)*dist, Math.sin(az)*Math.cos(el)*dist];
  return {eye,tgt};
}
function computeMatterEnv(p){
  return {
    spin: 0.55,
    gapGrow: smoothstep(0.15,0.5,p),
    accrete: smoothstep(0.1,0.55,p),
    diskFade: 1.0 - smoothstep(0.5,0.66,p),
    planetFade: smoothstep(0.42,0.6,p),
    starIntensity: mix(0.95, 0.42, ease(clamp((p-0.35)/0.5,0,1))),
    starSize: mix(0.032, 0.011, ease(clamp((p-0.2)/0.6,0,1))),
    magma: 1.0 - smoothstep(0.58,0.78,p),
    seaLevel: mix(0.75, 0.5, smoothstep(0.72,0.95,p)),  // sea rises (level threshold drops)
    cloud: pulse(p, 0.6,0.72, 0.9,1.0)*0.8 + smoothstep(0.7,0.85,p)*0.3,
    atmo: smoothstep(0.62,0.85,p),
    green: 0.0,
  };
}
function renderMatter(p, weight, aspect){
  const env=computeMatterEnv(p);
  const cam=matterCamera(p);
  const proj=M4.perspective(52*Math.PI/180, aspect, 0.02, 100);
  const view=M4.lookAt(cam.eye, cam.tgt, [0,1,0]);
  const vp=M4.mul(proj,view);
  const starW=matterStarWorld(p, cam.eye);
  // project star to screen for the glow pass
  const sc=projectPoint(vp, starW);

  // 1) star glow (screen-space additive) — behind disk
  if(weight>0.001){
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE);
    fsPass(MATTER.starProg, sceneFBO, pr=>{
      gl.uniform2f(pr.u('uStar'), sc.x, sc.y);
      gl.uniform1f(pr.u('uSize'), env.starSize);
      gl.uniform1f(pr.u('uAspect'), aspect);
      gl.uniform1f(pr.u('uIntensity'), sc.visible? env.starIntensity*weight : 0.0);
      gl.uniform1f(pr.u('uRays'), env.diskFade*0.4+0.12);
      gl.uniform3fv(pr.u('uColor'), [1.0,0.86,0.62]);
      gl.uniform1f(pr.u('uTime'), TCLOCK.sim);
    });
  }
  // 2) disk particles (additive)
  if(env.diskFade*weight>0.002){
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE); gl.disable(gl.DEPTH_TEST);
    gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFBO.fb); gl.viewport(0,0,sceneFBO.w,sceneFBO.h);
    gl.useProgram(MATTER.diskProg); gl.bindVertexArray(MATTER.diskVao);
    gl.uniformMatrix4fv(MATTER.diskProg.u('uViewProj'),false,vp);
    gl.uniform1f(MATTER.diskProg.u('uTime'), TCLOCK.sim);
    gl.uniform1f(MATTER.diskProg.u('uPointScale'), 2.4*sceneFBO.h/1080.0);
    gl.uniform1f(MATTER.diskProg.u('uSpin'), env.spin);
    gl.uniform1f(MATTER.diskProg.u('uGapGrow'), env.gapGrow);
    gl.uniform1f(MATTER.diskProg.u('uFade'), env.diskFade*weight);
    gl.uniform1f(MATTER.diskProg.u('uAccrete'), env.accrete);
    gl.uniform3fv(MATTER.diskProg.u('uAccent'), ACCENT);
    gl.drawArrays(gl.POINTS,0,MATTER.diskCount);
    gl.bindVertexArray(null);
  }
  // 3) planet (normal blend over accumulated buffer)
  if(env.planetFade*weight>0.002){
    gl.enable(gl.BLEND); gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    const invVP=M4.invert(vp);
    const lightDir=V3.norm(V3.sub([0,0,0], starW)); // from star toward planet(origin)
    fsPass(MATTER.planetProg, sceneFBO, pr=>{
      gl.uniformMatrix4fv(pr.u('uInvVP'),false,invVP);
      gl.uniform3fv(pr.u('uCamPos'), cam.eye);
      gl.uniform3fv(pr.u('uPlanetPos'), [0,0,0]);
      gl.uniform3fv(pr.u('uLightDir'), lightDir);
      gl.uniform3fv(pr.u('uAccent'), ACCENT);
      gl.uniform1f(pr.u('uRadius'), 0.5);
      gl.uniform1f(pr.u('uMagma'), env.magma);
      gl.uniform1f(pr.u('uSeaLevel'), env.seaLevel);
      gl.uniform1f(pr.u('uCloud'), env.cloud);
      gl.uniform1f(pr.u('uAtmo'), env.atmo);
      gl.uniform1f(pr.u('uGreen'), env.green);
      gl.uniform1f(pr.u('uTime'), TCLOCK.sim);
      gl.uniform1f(pr.u('uFade'), env.planetFade*weight);
    });
    gl.blendFunc(gl.ONE,gl.ONE); // restore additive default
  }
}
function projectPoint(vp, p){
  const x=vp[0]*p[0]+vp[4]*p[1]+vp[8]*p[2]+vp[12];
  const y=vp[1]*p[0]+vp[5]*p[1]+vp[9]*p[2]+vp[13];
  const w=vp[3]*p[0]+vp[7]*p[1]+vp[11]*p[2]+vp[15];
  if(w<=0) return {x:0.5,y:0.5,visible:false};
  return {x:(x/w)*0.5+0.5, y:(y/w)*0.5+0.5, visible:true};
}

/* -------------------------------------------------------------------- [LIFE] */
const LIFE = { ready:false, size:512, rdA:null, rdB:null, cur:null, seeded:false };
function createRDTarget(size){
  const tex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,size,size,0,gl.RGBA,gl.HALF_FLOAT,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.REPEAT);
  const fb=gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER,fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  return {tex,fb,w:size,h:size};
}
function buildLife(){
  LIFE.size = CFG.tier==='high'?512 : CFG.tier==='mid'?384 : 256;
  // the reaction-diffusion sim needs a float/half-float render target; if the GPU
  // lacks it, degrade gracefully (vent + cells + creatures still tell the story).
  LIFE.rdOK = !!(GLC.floatColor || GLC.halfFloat);
  if(LIFE.rdOK){
    LIFE.rdA=createRDTarget(LIFE.size);
    LIFE.rdB=createRDTarget(LIFE.size);
    gl.bindFramebuffer(gl.FRAMEBUFFER, LIFE.rdA.fb);
    if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE) LIFE.rdOK=false;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    LIFE.cur=LIFE.rdA;
  }

  // seed the reaction-diffusion field: U=1 everywhere, V in scattered patches
  LIFE.seedProg=program(FS_VS,`#version 300 es
  precision highp float; in vec2 vUv; out vec4 o; uniform float uSeed;
  ${GLSL_COMMON}
  void main(){
    float v=0.0;
    // scattered seed cells
    vec2 g=floor(vUv*22.0); float h=hash21(g+uSeed);
    if(h>0.90){ v=1.0; }
    // a denser cluster near the vent (bottom-centre)
    if(distance(vUv,vec2(0.5,0.14))<0.10 && hash21(vUv*90.0+uSeed)>0.4) v=1.0;
    o=vec4(1.0, v, 0.0, 1.0);
  }`,'life-seed');

  // Gray-Scott reaction-diffusion step (genuine PDE)
  LIFE.rdProg=program(FS_VS,`#version 300 es
  precision highp float; in vec2 vUv; out vec4 o;
  uniform sampler2D uState; uniform vec2 uTexel; uniform float uF,uK,uDt;
  void main(){
    vec2 s=texture(uState,vUv).xy;
    vec2 lap=
      texture(uState,vUv+vec2(-uTexel.x,0.0)).xy*0.2 +
      texture(uState,vUv+vec2( uTexel.x,0.0)).xy*0.2 +
      texture(uState,vUv+vec2(0.0,-uTexel.y)).xy*0.2 +
      texture(uState,vUv+vec2(0.0, uTexel.y)).xy*0.2 +
      texture(uState,vUv+vec2(-uTexel.x,-uTexel.y)).xy*0.05 +
      texture(uState,vUv+vec2( uTexel.x,-uTexel.y)).xy*0.05 +
      texture(uState,vUv+vec2(-uTexel.x, uTexel.y)).xy*0.05 +
      texture(uState,vUv+vec2( uTexel.x, uTexel.y)).xy*0.05 - s;
    float U=s.x, V=s.y, reac=U*V*V;
    float u2=U+(1.0*lap.x - reac + uF*(1.0-U))*uDt;
    float v2=V+(0.5*lap.y + reac - (uF+uK)*V)*uDt;
    o=vec4(clamp(u2,0.0,1.0),clamp(v2,0.0,1.0),0.0,1.0);
  }`,'life-rd');

  // underwater environment: abyssal gradient + hydrothermal vent glow
  LIFE.bgProg=program(FS_VS,`#version 300 es
  precision highp float; in vec2 vUv; out vec4 o;
  uniform float uTime,uOxygen,uVent,uFade; uniform vec2 uRes;
  ${GLSL_COMMON}
  void main(){
    vec2 uv=vUv;
    // depth gradient — dark abyss, lighter toward the surface (top) as oxygen rises
    vec3 deep=mix(vec3(0.01,0.05,0.07), vec3(0.02,0.10,0.12), uOxygen);
    vec3 shallow=mix(vec3(0.02,0.10,0.13), vec3(0.10,0.28,0.34), uOxygen);
    vec3 col=mix(deep,shallow,pow(uv.y,1.5));
    // sunlight shafts from the surface as the world oxygenates
    float shafts=0.0;
    for(int i=0;i<3;i++){ float x=0.3+0.2*float(i); shafts+=smoothstep(0.06,0.0,abs(uv.x-x-0.05*sin(uTime*0.2+float(i)))); }
    col+=vec3(0.15,0.4,0.4)*shafts*uv.y*uv.y*uOxygen*0.25;
    // hydrothermal vent glow at the bottom
    float d=distance(vUv*vec2(uRes.x/uRes.y,1.0), vec2(0.5*uRes.x/uRes.y,0.10));
    float flick=0.75+0.25*sin(uTime*5.0)+0.15*sin(uTime*13.0);
    col+=vec3(1.0,0.42,0.12)*exp(-d*4.5)*uVent*flick;
    col+=vec3(1.0,0.6,0.2)*exp(-d*11.0)*uVent*flick*1.5;
    o=vec4(col*uFade,1.0);
  }`,'life-bg');

  // reaction-diffusion display: chemistry as living, bioluminescent membranes
  LIFE.rdDisplay=program(FS_VS,`#version 300 es
  precision highp float; in vec2 vUv; out vec4 o;
  uniform sampler2D uRD; uniform vec2 uTexel; uniform float uOxygen,uFade,uAmt; uniform float uAspect;
  ${GLSL_COMMON}
  void main(){
    // aspect-correct 'cover' mapping of the square field onto the screen
    vec2 uv=vUv; uv.x=(uv.x-0.5)*uAspect*0.62+0.5; uv.y=uv.y*0.62+0.19;
    float v=texture(uRD,uv).y;
    float vx=texture(uRD,uv+vec2(uTexel.x,0)).y-texture(uRD,uv-vec2(uTexel.x,0)).y;
    float vy=texture(uRD,uv+vec2(0,uTexel.y)).y-texture(uRD,uv-vec2(0,uTexel.y)).y;
    float edge=length(vec2(vx,vy));
    vec3 membrane=mix(vec3(0.05,0.35,0.30), vec3(0.15,0.85,0.55), uOxygen);
    vec3 glow=mix(vec3(0.15,0.95,0.85), vec3(0.4,1.0,0.7), uOxygen);
    vec3 col=membrane*smoothstep(0.12,0.35,v);
    col+=glow*edge*3.0;                          // bright cell walls
    col+=vec3(0.2,0.6,0.9)*smoothstep(0.45,0.6,v)*0.4; // dense cores
    o=vec4(col*uAmt*uFade,1.0);
  }`,'life-rddisp');

  // protocells & Cambrian creatures — soft membranous / bioluminescent sprites
  LIFE.agentProg=program(`#version 300 es
  precision highp float;
  layout(location=0) in vec2 aPos;
  layout(location=1) in float aSize;
  layout(location=2) in vec3 aCol;
  layout(location=3) in float aGlow;
  layout(location=4) in float aData;   // >0.5 => creature; fractional => heading/2pi
  layout(location=5) in float aLin;
  uniform float uScale, uAspect;
  out vec3 vCol; out float vGlow; out float vKind; out float vHead; out float vLin;
  void main(){
    gl_Position=vec4(aPos.x, aPos.y, 0.0, 1.0);
    gl_PointSize=clamp(aSize*uScale, 1.0, 128.0);
    vCol=aCol; vGlow=aGlow; vLin=aLin;
    vKind = aData>0.5 ? 1.0 : 0.0;
    vHead = fract(aData)*6.2831853;
  }`,`#version 300 es
  precision highp float;
  in vec3 vCol; in float vGlow; in float vKind; in float vHead; in float vLin;
  out vec4 o;
  void main(){
    vec2 pc=gl_PointCoord*2.0-1.0;
    if(vKind<0.5){
      // protocell: soft vesicle with a brighter membrane ring + nucleus
      float r=length(pc);
      if(r>1.0) discard;
      float fill=smoothstep(1.0,0.0,r)*0.35;
      float membrane=smoothstep(1.0,0.72,r)-smoothstep(0.72,0.5,r);
      float nucleus=exp(-r*r*7.0);
      vec3 c=vCol*(fill+membrane*1.4) + vCol*nucleus*vGlow;
      if(vLin>0.5) c+=vec3(1.0,0.82,0.42)*nucleus*2.2;
      o=vec4(c,1.0);
    } else {
      // creature: oriented teardrop body + tail, bilateral
      float ca=cos(vHead), sa=sin(vHead);
      vec2 q=vec2(ca*pc.x+sa*pc.y, -sa*pc.x+ca*pc.y); // rotate into body frame (q.x = forward)
      float body=exp(-(q.x*q.x*2.2 + q.y*q.y*7.0)); // elongated along heading
      float tail=exp(-(pow(q.x+0.6,2.0)*5.0 + q.y*q.y*24.0))*0.5;
      float head=exp(-(pow(q.x-0.45,2.0)*10.0 + q.y*q.y*10.0))*0.7;
      float a=body+tail+head;
      if(a<0.02) discard;
      vec3 c=vCol*a*(0.8+vGlow);
      if(vLin>0.5) c+=vec3(1.0,0.82,0.42)*head*1.5;
      o=vec4(c,1.0);
    }
  }`,'life-agents');
  LIFE.agentBuf=gl.createBuffer();
  LIFE.agentVao=gl.createVertexArray();
  gl.bindVertexArray(LIFE.agentVao);
  gl.bindBuffer(gl.ARRAY_BUFFER, LIFE.agentBuf);
  const st=9*4; // pos2,size1,col3,glow1,data1,lin1
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,st,0);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1,1,gl.FLOAT,false,st,8);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2,3,gl.FLOAT,false,st,12);
  gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3,1,gl.FLOAT,false,st,24);
  gl.enableVertexAttribArray(4); gl.vertexAttribPointer(4,1,gl.FLOAT,false,st,28);
  gl.enableVertexAttribArray(5); gl.vertexAttribPointer(5,1,gl.FLOAT,false,st,32);
  gl.bindVertexArray(null);

  LIFE.ready=true;
  LIFE.seeded=false;
}
LIFE.seed=function(){
  gl.disable(gl.BLEND);
  fsPass(LIFE.seedProg, LIFE.rdA, pr=>{ gl.uniform1f(pr.u('uSeed'), 3.17); });
  LIFE.cur=LIFE.rdA;
  LIFE.seeded=true;
};
LIFE.step=function(n, F, K){
  gl.disable(gl.BLEND);
  const texel=1.0/LIFE.size;
  for(let i=0;i<n;i++){
    const src=LIFE.cur, dst=(LIFE.cur===LIFE.rdA)?LIFE.rdB:LIFE.rdA;
    fsPass(LIFE.rdProg, dst, pr=>{
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, src.tex); gl.uniform1i(pr.u('uState'),0);
      gl.uniform2f(pr.u('uTexel'), texel, texel);
      gl.uniform1f(pr.u('uF'), F); gl.uniform1f(pr.u('uK'), K); gl.uniform1f(pr.u('uDt'), 1.0);
    });
    LIFE.cur=dst;
  }
};
/* ---- protocells & creatures: genuine replication, mutation, selection ---- */
LIFE.cells=[]; LIFE.creatures=[]; LIFE.agentsInit=false; LIFE.foodX=0; LIFE.foodY=0;
const VENT=[0.0,-0.78];
function mutate(v,rate){ return clamp(v+(rand()*2-1)*rate,0,1); }
LIFE.initAgents=function(){
  LIFE.maxCells = CFG.tier==='high'?520 : CFG.tier==='mid'?340 : 170;
  LIFE.maxCreat = CFG.tier==='high'?80 : CFG.tier==='mid'?55 : 28;
  LIFE.cells=[]; LIFE.creatures=[];
  for(let i=0;i<26;i++){
    LIFE.cells.push({ x:VENT[0]+(rand()*2-1)*0.25, y:VENT[1]+rand()*0.3,
      vx:(rand()*2-1)*0.05, vy:rand()*0.05,
      g:[rand(),rand(),0.4+rand()*0.5], energy:0.3+rand()*0.4, age:0, lin:false });
  }
  LIFE.cells[0].lin=true; // the tracked thread lives in this line
  LIFE.agentsInit=true;
};
LIFE.updateAgents=function(p){
  const dt=1/60;
  // ---------- protocells ----------
  const optimal = mix(0.28,0.72,p);          // the selection target drifts -> evolution
  const attract = 1.0 - smoothstep(0.4,0.75,p); // early: cluster at vent; later: disperse & rise
  const rise = smoothstep(0.45,0.9,p)*0.05;  // oxygenation lifts life toward the light
  const born=[];
  for(const c of LIFE.cells){
    c.vx += (rand()-0.5)*0.5*dt + (VENT[0]-c.x)*0.35*dt*attract;
    c.vy += (rand()-0.5)*0.5*dt + (VENT[1]-c.y)*0.35*dt*attract + rise*dt*30.0;
    const sp=Math.hypot(c.vx,c.vy), mx=0.35; if(sp>mx){ c.vx*=mx/sp; c.vy*=mx/sp; }
    c.x+=c.vx*dt; c.y+=c.vy*dt;
    if(c.x<-1.05){c.x=-1.05;c.vx*=-0.6;} if(c.x>1.05){c.x=1.05;c.vx*=-0.6;}
    if(c.y<-0.98){c.y=-0.98;c.vy*=-0.6;} if(c.y>0.98){c.y=0.98;c.vy*=-0.5;}
    const prox=Math.exp(-((c.x-VENT[0])**2+(c.y-VENT[1])**2)*2.0);
    const fitness=1.0-Math.abs(c.g[0]-optimal);
    c.energy += (0.16 + 0.9*prox)*(0.35+0.65*fitness)*dt - 0.14*dt;
    c.age += dt;
    if(c.lin){ c.energy=Math.max(c.energy,0.5); }         // protect the thread
    if(c.energy>1.0 && (LIFE.cells.length+born.length)<LIFE.maxCells){
      c.energy*=0.5;
      born.push({ x:c.x+(rand()-0.5)*0.03, y:c.y+(rand()-0.5)*0.03,
        vx:c.vx+(rand()-0.5)*0.06, vy:c.vy+(rand()-0.5)*0.06,
        g:[mutate(c.g[0],0.06),mutate(c.g[1],0.06),mutate(c.g[2],0.05)],
        energy:c.energy, age:0, lin:false });
    }
  }
  for(const b of born) LIFE.cells.push(b);
  // deaths
  LIFE.cells = LIFE.cells.filter(c=> c.lin || (c.energy>0 && c.age<14));
  if(!LIFE.cells.some(c=>c.lin) && LIFE.cells.length) LIFE.cells[0].lin=true;

  // ---------- Cambrian creatures (evolvable swimmers) ----------
  if(p>0.66){
    // food drifts around; creatures with better controllers reach it & reproduce
    LIFE.foodX=0.6*Math.sin(TCLOCK.sim*0.5), LIFE.foodY=0.3*Math.cos(TCLOCK.sim*0.37)+0.1;
    const want=Math.min(LIFE.maxCreat, Math.floor(smoothstep(0.66,0.85,p)*LIFE.maxCreat));
    while(LIFE.creatures.length<want){
      LIFE.creatures.push(spawnCreature(null));
    }
    for(const cr of LIFE.creatures){
      // sensors -> tiny controller -> steering
      const dx=LIFE.foodX-cr.x, dy=LIFE.foodY-cr.y; const fd=Math.hypot(dx,dy)+1e-3;
      const toFood=Math.atan2(dy,dx);
      let steer = Math.sin(toFood-cr.h)*cr.w[0] + (rand()-0.5)*cr.w[1];
      cr.h += steer*dt*3.0 + Math.sin(TCLOCK.sim*cr.wob+cr.ph)*0.15*dt*3.0;
      const spd=cr.spd;
      cr.x+=Math.cos(cr.h)*spd*dt; cr.y+=Math.sin(cr.h)*spd*dt;
      if(cr.x<-1.1||cr.x>1.1) cr.h=Math.PI-cr.h; if(cr.y<-1.0||cr.y>1.0) cr.h=-cr.h;
      cr.x=clamp(cr.x,-1.1,1.1); cr.y=clamp(cr.y,-1.0,1.0);
      cr.age+=dt;
      if(fd<0.10){ cr.fitness+=1; LIFE.foodX=(rand()*2-1)*0.8; LIFE.foodY=(rand()*2-1)*0.8; }
    }
    // selection: occasionally replace worst with mutated offspring of best
    if(LIFE.creatures.length>=want && want>2 && Math.floor(TCLOCK.sim*2)%2===0){
      LIFE.creatures.sort((a,b)=>a.fitness-b.fitness);
      if(rand()<0.03){
        const best=LIFE.creatures[LIFE.creatures.length-1];
        LIFE.creatures[0]=spawnCreature(best);
      }
    }
  }
};
function spawnCreature(parent){
  const species = parent? parent.species : (rand()*3|0);
  const base={ x:(rand()*2-1)*0.8, y:(rand()*2-1)*0.8, h:rand()*6.28,
    age:0, fitness:0, species,
    wob: 6+rand()*8, ph:rand()*6.28,
    spd: 0.25+ (species*0.06) + rand()*0.1,
    w: parent? [mutate(parent.w[0],0.15)*2, mutate(parent.w[1]*0.5,0.15)*2] : [0.5+rand(), rand()*0.6] };
  return base;
}
function creatureColor(species, oxygen){
  // three body-plan "phyla" with distinct bioluminescent palettes
  if(species===0) return [mix(0.2,0.5,oxygen),1.0,0.7];
  if(species===1) return [1.0,mix(0.4,0.7,oxygen),0.85];
  return [0.4,0.85,1.0];
}
LIFE.drawAgents=function(p, env, aspect){
  const nCells=LIFE.cells.length, nCre=LIFE.creatures.length;
  const total=nCells+nCre; if(total===0) return;
  const arr=new Float32Array(total*9);
  const cellAmt=env.chem, creAmt=smoothstep(0.66,0.78,p);
  let o=0;
  const csz = 20*sceneFBO.h/1080;
  for(const c of LIFE.cells){
    const hue=c.g[1];
    // membrane pinks -> bioluminescent cyan/green, shifting with oxygenation
    const col=[mix(0.7,0.15,hue)*(0.6+0.5*env.oxygen), mix(0.4,0.95,hue), mix(0.5,0.7,hue)];
    arr[o]=c.x; arr[o+1]=c.y; arr[o+2]=csz*(0.7+c.g[2]);
    arr[o+3]=col[0]*cellAmt; arr[o+4]=col[1]*cellAmt; arr[o+5]=col[2]*cellAmt;
    arr[o+6]=0.8+0.6*Math.min(1,c.energy); arr[o+7]=0.0; arr[o+8]=c.lin?1:0; o+=9;
  }
  const crsz=46*sceneFBO.h/1080;
  for(const cr of LIFE.creatures){
    const col=creatureColor(cr.species, env.oxygen);
    arr[o]=cr.x; arr[o+1]=cr.y; arr[o+2]=crsz*(0.8+cr.species*0.15);
    arr[o+3]=col[0]*creAmt; arr[o+4]=col[1]*creAmt; arr[o+5]=col[2]*creAmt;
    arr[o+6]=0.7; arr[o+7]=1.0 + (cr.h/6.2831853); arr[o+8]=0.0; o+=9;
  }
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE); gl.disable(gl.DEPTH_TEST);
  gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFBO.fb); gl.viewport(0,0,sceneFBO.w,sceneFBO.h);
  gl.bindVertexArray(LIFE.agentVao);
  gl.bindBuffer(gl.ARRAY_BUFFER, LIFE.agentBuf);
  gl.bufferData(gl.ARRAY_BUFFER, arr, gl.DYNAMIC_DRAW);
  gl.useProgram(LIFE.agentProg);
  gl.uniform1f(LIFE.agentProg.u('uScale'), 1.0);
  gl.uniform1f(LIFE.agentProg.u('uAspect'), aspect);
  gl.drawArrays(gl.POINTS, 0, total);
  gl.bindVertexArray(null);
};

function computeLifeEnv(p){
  return {
    vent: 1.0 - smoothstep(0.55,0.85,p),           // vent dominant early, fades as we rise
    oxygen: smoothstep(0.35,0.75,p),               // Great Oxidation: world turns on
    chem: smoothstep(0.02,0.12,p)*(1.0-smoothstep(0.85,1.0,p)),
    // Gray-Scott params drift: from spot-forming to dividing ("mitosis")
    F: mix(0.022, 0.039, smoothstep(0.1,0.6,p)),
    K: mix(0.051, 0.061, smoothstep(0.1,0.6,p)),
  };
}
LIFE.render=function(p, weight, aspect){
  if(LIFE.rdOK && !LIFE.seeded) LIFE.seed();
  if(!LIFE.agentsInit) LIFE.initAgents();
  const env=computeLifeEnv(p);
  // advance the genuine chemistry every active frame (independent of playback speed)
  if(LIFE.rdOK){ LIFE.step(CFG.tier==='low'?6:10, env.F, env.K); }
  LIFE.updateAgents(p);

  // 1) underwater environment
  gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFBO.fb); gl.viewport(0,0,sceneFBO.w,sceneFBO.h);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE);
  fsPass(LIFE.bgProg, sceneFBO, pr=>{
    gl.uniform1f(pr.u('uTime'), TCLOCK.sim);
    gl.uniform1f(pr.u('uOxygen'), env.oxygen);
    gl.uniform1f(pr.u('uVent'), env.vent);
    gl.uniform1f(pr.u('uFade'), weight);
    gl.uniform2f(pr.u('uRes'), sceneFBO.w, sceneFBO.h);
  });
  // 2) reaction-diffusion chemistry (additive glow)
  if(LIFE.rdOK){
    fsPass(LIFE.rdDisplay, sceneFBO, pr=>{
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, LIFE.cur.tex); gl.uniform1i(pr.u('uRD'),0);
      gl.uniform2f(pr.u('uTexel'), 1.0/LIFE.size, 1.0/LIFE.size);
      gl.uniform1f(pr.u('uOxygen'), env.oxygen);
      gl.uniform1f(pr.u('uAmt'), env.chem);
      gl.uniform1f(pr.u('uFade'), weight);
      gl.uniform1f(pr.u('uAspect'), aspect);
    });
  }
  // 3) protocells & creatures
  LIFE.drawAgents(p, env, aspect);
};

/* -------------------------------------------------------------------- [MIND] */
/* One graph, grown by preferential-attachment-flavoured k-NN over a web-like
   node field — so the neural close-up and the city lattice both literally
   rhyme with Movement I's cosmic web. */
const MIND = { ready:false };
function buildMind(){
  const N = CFG.tier==='high'?1300 : CFG.tier==='mid'?800 : 420;
  const gridN=Math.max(8,Math.round(Math.sqrt(N)));
  const M=gridN*gridN;
  const S=1.0, spacing=(2*S)/gridN, jit=0.42*spacing, NF=1.7, DMAX=0.42, MAXD=0.4;
  const pos=new Float32Array(M*2);
  const eps=0.05;
  const phi=(x,y)=>fbm3(x*NF,y*NF,7.3,4);
  let i=0;
  for(let a=0;a<gridN;a++)for(let b=0;b<gridN;b++){
    const qx=-S+(a+0.5)*spacing+(rand()*2-1)*jit;
    const qy=-S+(b+0.5)*spacing+(rand()*2-1)*jit;
    let gx=(phi(qx+eps,qy)-phi(qx-eps,qy))/(2*eps);
    let gy=(phi(qx,qy+eps)-phi(qx,qy-eps))/(2*eps);
    let px=-gx*DMAX, py=-gy*DMAX; const pl=Math.hypot(px,py)||1; if(pl>MAXD){px*=MAXD/pl;py*=MAXD/pl;}
    pos[i*2]=qx+px; pos[i*2+1]=qy+py; i++;
  }
  // k-nearest-neighbour edges (uniform grid accel), plus a few long hub links
  const K=3;
  const edges=[]; const deg=new Int32Array(M);
  const G=gridN; const cell=(2*S+0.4)/G; const buckets=Array.from({length:G*G},()=>[]);
  const gi=(v)=>clamp(Math.floor((v+S+0.2)/cell),0,G-1);
  for(let n=0;n<M;n++) buckets[gi(pos[n*2])*G+gi(pos[n*2+1])].push(n);
  const seen=new Set();
  for(let n=0;n<M;n++){
    const cx=gi(pos[n*2]), cy=gi(pos[n*2+1]);
    const cand=[];
    for(let ax=-1;ax<=1;ax++)for(let ay=-1;ay<=1;ay++){
      const bx=cx+ax, by=cy+ay; if(bx<0||by<0||bx>=G||by>=G) continue;
      for(const m of buckets[bx*G+by]) if(m!==n) cand.push(m);
    }
    cand.sort((p,q)=>{
      const dp=(pos[p*2]-pos[n*2])**2+(pos[p*2+1]-pos[n*2+1])**2;
      const dq=(pos[q*2]-pos[n*2])**2+(pos[q*2+1]-pos[n*2+1])**2; return dp-dq;
    });
    for(let k=0;k<Math.min(K,cand.length);k++){
      const m=cand[k]; const key=n<m?n*M+m:m*M+n;
      if(seen.has(key)) continue; seen.add(key);
      edges.push([n,m]); deg[n]++; deg[m]++;
    }
  }
  // pick seed = highest-degree hub (the 'brain' we start inside)
  let seed=0; for(let n=1;n<M;n++) if(deg[n]>deg[seed]) seed=n;
  // BFS reveal order from the seed -> the network 'grows' outward from the mind
  const adj=Array.from({length:M},()=>[]);
  for(const [a,b] of edges){ adj[a].push(b); adj[b].push(a); }
  const dist=new Float32Array(M).fill(-1); dist[seed]=0; let q=[seed], maxd=0;
  while(q.length){ const nq=[]; for(const u of q){ for(const v of adj[u]) if(dist[v]<0){ dist[v]=dist[u]+1; maxd=Math.max(maxd,dist[v]); nq.push(v);} } q=nq; }
  const reveal=new Float32Array(M);
  for(let n=0;n<M;n++) reveal[n]= dist[n]<0? 1.0 : dist[n]/(maxd||1);

  // node render buffer: x,y,reveal,hub,rnd
  const nodeArr=new Float32Array(M*5);
  let maxdeg=1; for(let n=0;n<M;n++) maxdeg=Math.max(maxdeg,deg[n]);
  for(let n=0;n<M;n++){ nodeArr[n*5]=pos[n*2]; nodeArr[n*5+1]=pos[n*2+1];
    nodeArr[n*5+2]=reveal[n]; nodeArr[n*5+3]=deg[n]/maxdeg; nodeArr[n*5+4]=rand(); }
  MIND.nodeBuf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,MIND.nodeBuf);
  gl.bufferData(gl.ARRAY_BUFFER,nodeArr,gl.STATIC_DRAW);
  MIND.nodeVao=gl.createVertexArray(); gl.bindVertexArray(MIND.nodeVao);
  for(let a=0;a<3;a++) gl.enableVertexAttribArray(a);
  gl.vertexAttribPointer(0,2,gl.FLOAT,false,20,0);
  gl.vertexAttribPointer(1,1,gl.FLOAT,false,20,8);
  gl.vertexAttribPointer(2,1,gl.FLOAT,false,20,12);
  gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3,1,gl.FLOAT,false,20,16);
  gl.bindVertexArray(null);
  MIND.nodeCount=M;

  // edge render buffer: 2 verts/edge: x,y,reveal,hub,rnd
  const eArr=new Float32Array(edges.length*2*5);
  for(let e=0;e<edges.length;e++){
    const [a,b]=edges[e]; const rv=Math.max(reveal[a],reveal[b]);
    const hb=Math.max(deg[a],deg[b])/maxdeg; const rnd=Math.random();
    let o=e*10;
    eArr[o]=pos[a*2]; eArr[o+1]=pos[a*2+1]; eArr[o+2]=rv; eArr[o+3]=hb; eArr[o+4]=rnd;
    eArr[o+5]=pos[b*2]; eArr[o+6]=pos[b*2+1]; eArr[o+7]=rv; eArr[o+8]=hb; eArr[o+9]=rnd;
  }
  MIND.edgeBuf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,MIND.edgeBuf);
  gl.bufferData(gl.ARRAY_BUFFER,eArr,gl.STATIC_DRAW);
  MIND.edgeVao=gl.createVertexArray(); gl.bindVertexArray(MIND.edgeVao);
  for(let a=0;a<3;a++) gl.enableVertexAttribArray(a);
  gl.vertexAttribPointer(0,2,gl.FLOAT,false,20,0);
  gl.vertexAttribPointer(1,1,gl.FLOAT,false,20,8);
  gl.vertexAttribPointer(2,1,gl.FLOAT,false,20,12);
  gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3,1,gl.FLOAT,false,20,16);
  gl.bindVertexArray(null);
  MIND.edgeCount=edges.length;
  MIND.edges=edges; MIND.pos=pos; MIND.reveal=reveal; MIND.seed=seed;

  // travelling synaptic signals (subset of edges)
  const nsig=Math.min(edges.length, CFG.tier==='high'?600:CFG.tier==='mid'?360:160);
  MIND.signals=[];
  for(let s=0;s<nsig;s++){ MIND.signals.push({ e:(rand()*edges.length)|0, ph:rand(), sp:0.4+rand()*0.9 }); }
  MIND.sigBuf=gl.createBuffer();
  MIND.sigVao=gl.createVertexArray(); gl.bindVertexArray(MIND.sigVao);
  gl.bindBuffer(gl.ARRAY_BUFFER,MIND.sigBuf);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,12,0); // pos
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1,1,gl.FLOAT,false,12,8); // bright
  gl.bindVertexArray(null);
  MIND.sigArr=new Float32Array(nsig*3);

  // shared vertex transform (2D orthographic pan/zoom)
  const XFORM=`
    uniform vec2 uCenter; uniform float uZoom, uAspect;
    vec4 place(vec2 w){ vec2 s=(w-uCenter)*uZoom; s.x/=uAspect; return vec4(s,0.0,1.0); }`;
  MIND.edgeProg=program(`#version 300 es
  precision highp float;
  layout(location=0) in vec2 aPos; layout(location=1) in float aRnd;
  layout(location=2) in float aReveal; layout(location=3) in float aHub;
  ${XFORM}
  uniform float uGrowth,uTime; out float vB; out float vHub;
  void main(){
    gl_Position=place(aPos);
    float on=smoothstep(aReveal-0.05,aReveal+0.02,uGrowth);
    float flow=0.55+0.45*sin(uTime*2.0 + aRnd*30.0);
    vB=on*flow*(0.5+0.7*aHub); vHub=aHub;
  }`,`#version 300 es
  precision highp float; in float vB; in float vHub; out vec4 o;
  uniform vec3 uEdgeCol;
  void main(){ o=vec4(uEdgeCol*vB, 1.0); }`,'mind-edge');

  MIND.nodeProg=program(`#version 300 es
  precision highp float;
  layout(location=0) in vec2 aPos; layout(location=1) in float aReveal;
  layout(location=2) in float aRnd; layout(location=3) in float aHub;
  ${XFORM}
  uniform float uGrowth,uTime,uScale; uniform int uSeedIdx; out float vB; out float vHub; out float vSeed;
  void main(){
    gl_Position=place(aPos);
    float seed = (gl_VertexID==uSeedIdx)?1.0:0.0;
    float on=smoothstep(aReveal-0.03,aReveal+0.02,uGrowth);
    on=max(on, seed);                                   // the lineage 'mind' is always lit
    gl_PointSize=clamp(uScale*(1.5+7.0*aHub)*on*(1.0+2.2*seed), 0.0, 110.0);
    vB=on*(0.4+1.6*aHub)*(0.7+0.3*sin(uTime*3.0+aRnd*40.0));
    if(seed>0.5) vB=1.8*(0.75+0.25*sin(uTime*2.2));
    vHub=aHub; vSeed=seed;
  }`,`#version 300 es
  precision highp float; in float vB; in float vHub; in float vSeed; out vec4 o;
  uniform vec3 uNodeCol, uAccent;
  void main(){ vec2 p=gl_PointCoord*2.0-1.0; float r=dot(p,p); if(r>1.0) discard;
    float c=exp(-r*3.0); vec3 col=mix(uNodeCol,uAccent,vSeed);
    o=vec4(col*c*vB,1.0); }`,'mind-node');

  MIND.sigProg=program(`#version 300 es
  precision highp float;
  layout(location=0) in vec2 aPos; layout(location=1) in float aB;
  ${XFORM}
  uniform float uScale; out float vB;
  void main(){ gl_Position=place(aPos); gl_PointSize=clamp(uScale*3.0,1.0,40.0); vB=aB; }`,`#version 300 es
  precision highp float; in float vB; out vec4 o; uniform vec3 uSigCol;
  void main(){ vec2 p=gl_PointCoord*2.0-1.0; float r=dot(p,p); if(r>1.0) discard;
    o=vec4(uSigCol*exp(-r*2.5)*vB,1.0); }`,'mind-sig');

  MIND.ready=true;
}
function mindCam(p){
  // begin inside the seed hub (a single brain), pull back to reveal the whole
  // lattice of minds — same web, smallest scale to largest.
  const seed=MIND.seed||0;
  const sx=MIND.pos?MIND.pos[seed*2]:0, sy=MIND.pos?MIND.pos[seed*2+1]:0;
  const out=ease(clamp(p/0.82,0,1));
  const zoom=mix(3.2, 0.92, out);
  const cx=mix(sx,0.0,out), cy=mix(sy,0.0,out);
  return {center:[cx,cy], zoom};
}
function mindEnv(p){
  return {
    growth: mix(0.30, 1.08, ease(clamp(p/0.82,0,1))),   // connectivity rises (intelligence signal)
    neuralToCity: smoothstep(0.28,0.72,p),              // cyan synapse -> gold city
    fade: 1.0 - smoothstep(0.95,1.0,p),
    lookUp: smoothstep(0.88,1.0,p),
  };
}
MIND.render=function(p, weight, aspect){
  const env=mindEnv(p); const cam=mindCam(p);
  const nodeScale=sceneFBO.h/1080;
  // update travelling signals along revealed edges
  const t=TCLOCK.sim; let o=0;
  for(const s of MIND.signals){
    const e=MIND.edges[s.e]; const a=e[0],b=e[1];
    const rv=Math.max(MIND.reveal[a],MIND.reveal[b]);
    const on = env.growth>rv ? 1.0 : 0.0;
    const f=(t*s.sp+s.ph)%1.0;
    MIND.sigArr[o]=MIND.pos[a*2]+(MIND.pos[b*2]-MIND.pos[a*2])*f;
    MIND.sigArr[o+1]=MIND.pos[a*2+1]+(MIND.pos[b*2+1]-MIND.pos[a*2+1])*f;
    MIND.sigArr[o+2]=on*(0.5+0.5*Math.sin(f*Math.PI)); o+=3;
  }
  const edgeCol=[mix(0.25,1.0,env.neuralToCity), mix(0.9,0.72,env.neuralToCity), mix(1.0,0.35,env.neuralToCity)];
  const nodeCol=[mix(0.6,1.0,env.neuralToCity), mix(1.0,0.78,env.neuralToCity), mix(1.0,0.42,env.neuralToCity)];
  const sigCol=[0.6,1.0,1.0];
  const setX=(pr)=>{ gl.uniform2fv(pr.u('uCenter'),cam.center); gl.uniform1f(pr.u('uZoom'),cam.zoom); gl.uniform1f(pr.u('uAspect'),aspect); };

  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE); gl.disable(gl.DEPTH_TEST);
  gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFBO.fb); gl.viewport(0,0,sceneFBO.w,sceneFBO.h);
  // edges
  gl.useProgram(MIND.edgeProg); gl.bindVertexArray(MIND.edgeVao); setX(MIND.edgeProg);
  gl.uniform1f(MIND.edgeProg.u('uGrowth'),env.growth); gl.uniform1f(MIND.edgeProg.u('uTime'),t);
  gl.uniform3fv(MIND.edgeProg.u('uEdgeCol'), edgeCol.map(v=>v*weight*env.fade));
  gl.drawArrays(gl.LINES,0,MIND.edgeCount*2);
  // nodes
  gl.useProgram(MIND.nodeProg); gl.bindVertexArray(MIND.nodeVao); setX(MIND.nodeProg);
  gl.uniform1f(MIND.nodeProg.u('uGrowth'),env.growth); gl.uniform1f(MIND.nodeProg.u('uTime'),t);
  gl.uniform1f(MIND.nodeProg.u('uScale'),nodeScale*mix(1.0,1.6,env.neuralToCity));
  gl.uniform3fv(MIND.nodeProg.u('uNodeCol'), nodeCol.map(v=>v*weight*env.fade));
  gl.uniform1i(MIND.nodeProg.u('uSeedIdx'), MIND.seed);
  gl.uniform3fv(MIND.nodeProg.u('uAccent'), ACCENT.map(v=>v*weight*env.fade));
  gl.drawArrays(gl.POINTS,0,MIND.nodeCount);
  // signals
  gl.bindVertexArray(MIND.sigVao); gl.bindBuffer(gl.ARRAY_BUFFER,MIND.sigBuf);
  gl.bufferData(gl.ARRAY_BUFFER,MIND.sigArr,gl.DYNAMIC_DRAW);
  gl.useProgram(MIND.sigProg); setX(MIND.sigProg);
  gl.uniform1f(MIND.sigProg.u('uScale'),nodeScale*mix(2.2,1.0,env.neuralToCity));
  gl.uniform3fv(MIND.sigProg.u('uSigCol'), sigCol.map(v=>v*weight*env.fade));
  gl.drawArrays(gl.POINTS,0,MIND.signals.length);
  gl.bindVertexArray(null);
};

/* --------------------------------------------------------------------- [SEQ] */
const ACCENT = [1.0, 0.80, 0.42]; // sacred lineage accent (warm gold)
const TCLOCK = { wall:0, sim:0, t:0 };

// A tiny keyframe helper: envelopes are functions of normalized piece time p (0..1)
function seg(p, a, b){ return smoothstep(a,b,p); }
function pulse(p,a,b,c,d){ return smoothstep(a,b,p)*(1.0-smoothstep(c,d,p)); }

// Camera: orbit params -> eye/target
function cosmosCamera(p){
  // p is normalized within cosmos (0..1): begin close inside the fireball, pull
  // back to reveal the full web, then dive toward a bright node (into Matter).
  const distOut = mix(0.9, 5.2, ease(clamp(p/0.78,0,1)));
  const dive = ease(clamp((p-0.85)/0.15,0,1));
  const dist = mix(distOut, 0.8, dive);
  const az = 0.2 + p*1.15;
  const el = 0.12 + 0.22*Math.sin(p*3.14159);
  // dive toward the lineage node's final position
  const node = COSMOS.lineageFinal || [0,0,0];
  const tgt = V3.scale(node, dive*0.9);
  const eye=[tgt[0]+Math.cos(az)*Math.cos(el)*dist,
             tgt[1]+Math.sin(el)*dist,
             tgt[2]+Math.sin(az)*Math.cos(el)*dist];
  return {eye, tgt};
}

function computeCosmosEnv(p){
  // p normalized 0..1 within cosmos (cosmos spans global 0..0.34). Beats are
  // timed so they line up with the caption script and the cosmic clock:
  //   fireball/nucleosynthesis (0..0.35) · recombination (~0.43) ·
  //   dark ages (0.45..0.70) · first stars (0.70..0.85) · web + dive (0.85..1.0)
  const growth = ease(clamp((p-0.48)/0.44,0,1));               // structure grows through the dark ages
  const tempK = mix(3.5e4, 1400.0, ease(clamp(p/0.45,0,1)));   // plasma cools white-blue -> red
  const afterglow = smoothstep(0.0,0.04,p)*(1.0-smoothstep(0.34,0.46,p)); // hot fireball fog to recombination
  const cmb = smoothstep(0.40,0.48,p)*(1.0-smoothstep(0.66,0.84,p));      // CMB whisper through the dark ages
  const starIgnite = smoothstep(0.68,0.84,p);                  // first stars punch through the dark
  const coldWeb = smoothstep(0.44,0.66,p);                     // neutral gas cools to cold violet structure
  const pointScale = mix(2.0, 3.2, p);
  const fade = 1.0;                                            // crossfade to Matter handled by movement weight
  return {growth, tempK, afterglow, cmb, starIgnite, coldWeb, pointScale, fade};
}

/* ---- Director: the four movements as one film, joined by crossfades ---- */
const MOVEMENTS = [
  { name:'cosmos', a:0.000, b:0.340, fin:0.001, fout:0.90 },
  { name:'matter', a:0.310, b:0.600, fin:0.10,  fout:0.88 },
  { name:'life',   a:0.570, b:0.820, fin:0.10,  fout:0.90 },
  { name:'mind',   a:0.790, b:1.000, fin:0.10,  fout:0.93 },
];
function movWeight(m, pt){
  const p=(pt-m.a)/(m.b-m.a);
  if(p<0||p>1) return {w:0,p:clamp(p,0,1)};
  const w = smoothstep(0,m.fin,p)*(1.0-smoothstep(m.fout,1.0,p));
  return {w, p};
}

/* Per-movement colour grade — one continuous sunrise across cosmic time */
const GRADES = {
  cosmos:{ exposure:1.06, bloom:1.05, vignette:0.85, gradeAmt:0.55, shadowTint:[0.60,0.74,1.22], hiTint:[1.08,1.03,0.97] },
  matter:{ exposure:1.12, bloom:0.85, vignette:0.80, gradeAmt:0.55, shadowTint:[0.95,0.72,0.5],  hiTint:[1.16,1.0,0.8] },
  life:  { exposure:1.10, bloom:0.9,  vignette:0.9,  gradeAmt:0.6,  shadowTint:[0.4,0.85,0.9],   hiTint:[0.85,1.12,1.0] },
  mind:  { exposure:1.08, bloom:1.0,  vignette:0.85, gradeAmt:0.58, shadowTint:[0.55,0.6,1.15],  hiTint:[1.14,1.02,0.8] },
};
function computeGrade(pt){
  const g = { exposure:0, bloom:0, vignette:0, grain:0.026, ca:0.010, gradeAmt:0,
    lift:[0,0,0], gamma:[1,1,1], gain:[1,1,1], shadowTint:[0,0,0], hiTint:[0,0,0] };
  let tot=0;
  for(const m of MOVEMENTS){ const {w}=movWeight(m,pt); if(w<=0) continue;
    const s=GRADES[m.name]; tot+=w;
    g.exposure+=s.exposure*w; g.bloom+=s.bloom*w; g.vignette+=s.vignette*w; g.gradeAmt+=s.gradeAmt*w;
    for(let i=0;i<3;i++){ g.shadowTint[i]+=s.shadowTint[i]*w; g.hiTint[i]+=s.hiTint[i]*w; }
  }
  if(tot<1e-4){ const s=GRADES.cosmos; return Object.assign(g,{exposure:s.exposure,bloom:s.bloom,vignette:s.vignette,gradeAmt:s.gradeAmt,shadowTint:s.shadowTint.slice(),hiTint:s.hiTint.slice()}); }
  const inv=1/tot;
  g.exposure*=inv; g.bloom*=inv; g.vignette*=inv; g.gradeAmt*=inv;
  for(let i=0;i<3;i++){ g.shadowTint[i]*=inv; g.hiTint[i]*=inv; }
  return g;
}

/* Cosmic clock — map normalized time to log years since Big Bang */
// piecewise-log map from piece-time to real seconds since the Big Bang, anchored
// to the actual epochs each beat depicts (interpolated linearly in log-time).
const YR=3.15576e7;
const CLOCK_ANCHORS=[ // [pt, log10(seconds since Big Bang)]
  [0.00,-43], [0.035,-6], [0.06,0], [0.10,Math.log10(180)],
  [0.145,Math.log10(3.8e5*YR)], [0.24,Math.log10(1e8*YR)], [0.30,Math.log10(2e8*YR)],
  [0.36,Math.log10(1e9*YR)], [0.50,Math.log10(9.2e9*YR)], [0.60,Math.log10(9.3e9*YR)],
  [0.72,Math.log10(1.0e10*YR)], [0.80,Math.log10(1.325e10*YR)], [0.92,Math.log10(1.37e10*YR)],
  [1.00,Math.log10(1.38e10*YR)] ];
function cosmicSeconds(pt){
  const A=CLOCK_ANCHORS;
  for(let i=0;i<A.length-1;i++){ if(pt<=A[i+1][0]){ const t=(pt-A[i][0])/(A[i+1][0]-A[i][0]);
    return Math.pow(10, mix(A[i][1],A[i+1][1],clamp(t,0,1))); } }
  return Math.pow(10, A[A.length-1][1]);
}
function updateClock(pt){
  const el = document.getElementById('clock');
  const prog = el.querySelector('.prog');
  const tEl = el.querySelector('.t');
  const eraEl = el.querySelector('.era');
  el.style.opacity = 0.88;
  prog.style.width = (pt*100).toFixed(2)+'%';
  tEl.textContent = 't = '+formatTime(cosmicSeconds(pt));
  eraEl.textContent = eraFor(pt);
}
function formatTime(secs){
  const yr=3.15576e7;
  if(secs < 1e-30) return (secs.toExponential(1))+' s';
  if(secs < 1) return secs.toExponential(1)+' s';
  if(secs < 60) return secs.toFixed(1)+' s';
  if(secs < 3600) return (secs/60).toFixed(1)+' min';
  if(secs < yr) return (secs/86400).toFixed(1)+' days';
  const years=secs/yr;
  if(years<1e3) return years.toFixed(0)+' yr';
  if(years<1e6) return (years/1e3).toFixed(1)+' Kyr';
  if(years<1e9) return (years/1e6).toFixed(1)+' Myr';
  return (years/1e9).toFixed(2)+' Gyr';
}
function eraFor(pt){
  if(pt<0.03) return 'THE PLANCK EPOCH';
  if(pt<0.075) return 'PRIMORDIAL PLASMA';
  if(pt<0.10) return 'NUCLEOSYNTHESIS';
  if(pt<0.17) return 'RECOMBINATION';
  if(pt<0.26) return 'THE DARK AGES';
  if(pt<0.305) return 'FIRST LIGHT';
  if(pt<0.36) return 'THE COSMIC WEB';
  if(pt<0.49) return 'STAR FORMATION';
  if(pt<0.60) return 'A WORLD FORMS';
  if(pt<0.66) return 'HADEAN OCEANS';
  if(pt<0.74) return 'ABIOGENESIS';
  if(pt<0.79) return 'THE GREAT OXIDATION';
  if(pt<0.84) return 'THE CAMBRIAN';
  if(pt<0.94) return 'NERVOUS SYSTEMS';
  return 'CIVILISATION';
}

/* Captions — the full script (§7), sparse, small caps, one at a time */
const CAPTIONS = [
  {t:0.010, d:0.052, text:'In the beginning — a single point, hotter than any fire'},
  {t:0.080, d:0.042, text:'Three minutes · the first nuclei form — hydrogen and helium'},
  {t:0.145, d:0.050, text:'380,000 years · the universe cools and becomes transparent', sub:'this first light still surrounds us as the cosmic microwave background'},
  {t:0.215, d:0.040, text:'The dark ages · no stars yet'},
  {t:0.272, d:0.040, text:'~200 million years · the first stars ignite'},
  {t:0.315, d:0.038, text:'Gravity draws matter into a vast web of filaments and voids'},
  {t:0.358, d:0.040, text:'Inside one filament, a cloud of gas collapses'},
  {t:0.405, d:0.040, text:'A star is born, wrapped in a disk of dust'},
  {t:0.455, d:0.040, text:'Dust becomes rock — rock becomes worlds'},
  {t:0.508, d:0.040, text:'One world settles at the right distance for liquid water'},
  {t:0.560, d:0.040, text:'Oceans condense from steam and comet-ice'},
  {t:0.612, d:0.044, text:'In the dark near the vents, chemistry begins to copy itself'},
  {t:0.668, d:0.044, text:'A molecule that makes copies of itself — the first life'},
  {t:0.716, d:0.044, text:'Life learns to drink sunlight, and fills the air with oxygen'},
  {t:0.766, d:0.038, text:'Single cells join into many — bodies appear'},
  {t:0.800, d:0.040, text:'Movement becomes behavior — behavior becomes thought'},
  {t:0.846, d:0.040, text:'A nervous system — a map of the world, drawn in cells'},
  {t:0.898, d:0.042, text:'Minds reach across the dark to one another'},
  {t:0.948, d:0.048, text:'And one of them looks up, and wonders where it all began'},
];
let capState = { idx:-1, shownUntil:-1 };
function updateCaptions(pt){
  const capEl = document.getElementById('caption');
  const mainEl = capEl.querySelector('.main');
  // find active caption
  let active=null;
  for(const c of CAPTIONS){ if(pt>=c.t && pt<c.t+c.d) { active=c; break; } }
  if(active){
    const key = active.t;
    if(capState.idx!==key){
      capState.idx=key;
      mainEl.innerHTML = active.text + (active.sub?('<span class="sub">'+active.sub+'</span>'):'');
    }
    // fade in/out within the window
    const local=(pt-active.t)/active.d;
    const a = smoothstep(0,0.12,local)*(1.0-smoothstep(0.80,1.0,local));
    capEl.style.opacity = a.toFixed(3);
  } else {
    capEl.style.opacity = 0;
    capState.idx=-1;
  }
}

/* -------------------------------------------------------------------- [AUDIO] */
/* Optional generative ambient bed. Browsers block autoplay without a gesture and
   this piece takes none, so audio stays SILENT by default and the visuals never
   depend on it; if the context is ever allowed to run (an incidental pointer/key,
   or a permissive environment) a slow evolving drone fades in and shifts per
   movement, returning to the opening tone as it loops. */
const AUDIO = { ready:false, on:false, voices:[], lastAccent:-1 };
const AUDIO_MOODS = {
  cosmos:{ root:55.0,  chord:[1,1.5,2,3,4],       bright:320,  level:0.85 }, // A1 open fifths, cold
  matter:{ root:65.41, chord:[1,1.5,2,2.5,3],     bright:760,  level:1.0  }, // C2, warming
  life:  { root:49.0,  chord:[1,1.2,1.5,1.8,2.4], bright:940,  level:0.9  }, // G1-ish, organic
  mind:  { root:65.41, chord:[1,1.25,1.5,2,3],    bright:1700, level:1.0  }, // C major, bright/resolving
};
function initAudio(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    const ctx = new AC();
    AUDIO.ctx = ctx;
