<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stirling Numbers of the First Kind</title>
  <style>
    :root { --navy:#1f3864; --accent:#0066cc; --ink:#222; --muted:#5c6672; --line:#e3e8ef; --soft:#f5f8fc; }
    * { box-sizing: border-box; }
    body {
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background: #fff;
      margin: 0;
      line-height: 1.65;
    }
    .doc { max-width: 820px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
    h1, h2, h3, h4 { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--navy); line-height: 1.25; margin-top: 2rem; }
    h1 { font-size: 2rem; margin-top: 0.5rem; }
    h2 { font-size: 1.5rem; border-bottom: 1px solid var(--line); padding-bottom: 0.3rem; }
    h3 { font-size: 1.2rem; }
    a { color: var(--accent); }
    p, li { font-size: 1.05rem; }
    code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; background: var(--soft); padding: 0.1em 0.35em; border-radius: 4px; font-size: 0.9em; }
    pre { background: var(--soft); padding: 1rem; border-radius: 8px; overflow-x: auto; border: 1px solid var(--line); }
    pre code { background: none; padding: 0; }
    blockquote { margin: 1.2rem 0; padding: 0.6rem 1.1rem; border-left: 4px solid var(--navy); background: var(--soft); border-radius: 0 8px 8px 0; }
    table { border-collapse: collapse; width: 100%; margin: 1.2rem 0; display: block; overflow-x: auto; font-size: 0.98rem; }
    th, td { border: 1px solid var(--line); padding: 0.5rem 0.8rem; text-align: left; }
    th { background: var(--soft); }
    hr { border: none; border-top: 1px solid var(--line); margin: 2rem 0; }
    .loading { color: var(--muted); font-style: italic; }
    mjx-container { overflow-x: auto; overflow-y: hidden; max-width: 100%; }
  </style>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <article class="doc" id="doc"><p class="loading">Rendering…</p></article>

  <script>
    // Protect TeX from the Markdown parser, render, then restore for MathJax.
    var store = [];
    function stash(m) { store.push(m); return 'ZZMATHZZ' + (store.length - 1) + 'ZZ'; }
    function protect(md) {
      md = md.replace(/\$\$([\s\S]+?)\$\$/g, stash);
      md = md.replace(/\\\[([\s\S]+?)\\\]/g, stash);
      md = md.replace(/\\\(([\s\S]+?)\\\)/g, stash);
      md = md.replace(/\$([^\$\n]+?)\$/g, stash);
      return md;
    }
    function restore(html) {
      return html.replace(/ZZMATHZZ(\d+)ZZ/g, function (_, i) { return store[+i]; });
    }

    fetch('RESULTS.md')
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (md) {
        var protectedMd = protect(md);
        var render = (window.marked && marked.parse) ? marked.parse : window.marked;
        var html = restore(render(protectedMd));
        document.getElementById('doc').innerHTML = html;
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js';
        s.async = true;
        document.head.appendChild(s);
      })
      .catch(function (e) {
        document.getElementById('doc').innerHTML =
          '<h1>Stirling Numbers of the First Kind</h1><p>Could not load the write-up (' + e.message + ').</p>';
      });
  </script>
</body>
</html>
